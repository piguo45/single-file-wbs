      const w=c.pd.who;
      const r=w.kind==="issue"?issueRef(w.pj,w.id,c.pn):null;
      const brk=!!r&&!hasIssue(r.pj,r.id);   // 待っている相手の課題が無い＝links と同じ壊れたリンク表示
      const nm=r?refFull(r):w.name;
      const sub=[nm,c.pd.until?"（"+mdSlash(c.pd.until)+"）":""].filter(Boolean).join("");
      const sh=sub?` <span class="mksub${brk?" lk-x":""}"${brk?` title="${esc(t("lkBroken"))}"`:""}>${esc(sub)}</span>`:"";
      mk.push(`<span class="mk mk-wait">${esc(t("mkWait"))}${sh}</span>`);}

      mk.push(`<span class="mk mk-days${c.todoDays>=7?" mk-old":""}" title="${esc(t("mkTodoDaysTip"))}">${esc(t("mkTodoDays")(c.todoDays))}</span>`);

  // ===== リンク台帳（links[]）＝課題側だけに持つ。鍵の名前で4形を区別する（混ぜて書けない） =====
  const LK_HTTP=/^https?:\/\//i;
  function linkOf(l){
    if(!okObj(l))return null;
    const pj=str(l.project);
    if(l.url!==undefined&&l.url!==null)return {k:"url",label:str(l.title)||str(l.url),url:str(l.url)};
    if(l.wbs!==undefined&&l.wbs!==null&&String(l.wbs)!=="")return {k:"wbs",pj,id:String(l.wbs)};
    if(l.issue!==undefined&&l.issue!==null&&String(l.issue)!=="")return {k:"issue",pj,id:String(l.issue)};
    return null;
  }
  const findProj=nm=>curProjs.find(x=>projName(x)===nm)||null;
  const hasIssue=(pj,id)=>{const p=findProj(pj);return !!p&&normalizeIssues(p).some(x=>String(x.id)===id);};
  const findIssue=(pj,id)=>{const p=findProj(pj);if(!p)return null;
    return normalizeIssues(p).find(x=>String(x.id)===String(id))||null;};

  // 別案件の課題は「勤怠-2」（案件名の先頭2文字＋番号）。同じ案件は「#2」のまま。データは不変
  function issueRef(pj,id,curPn){
    const cross=!!(pj&&pj!==curPn);
    return {cross, id:String(id), pj:pj||curPn,
            label:cross?str(pj).slice(0,2)+"-"+id:"#"+id,
            title:cross?str(pj)+" #"+id:"#"+id};
  }
  function hasWbs(pj,id){
    const p=findProj(pj); if(!p)return false;
    if(!Array.isArray(p.tasks))return true;  // tasks が無いファイルでは検査しない（壊れ扱いにしない）
    let ok=false;
    // children が配列でない（数値・文字列・オブジェクト）壊れたデータでも落ちないよう、非配列は「子なし」扱い
    (function walk(ns){if(!Array.isArray(ns))return;
      for(const n of ns){if(!okObj(n))continue;
        if(String(n.id)===id){ok=true;return;} walk(n.children); if(ok)return;}})(p.tasks);
    return ok;
  }
  // 課題への参照（押すと飛ぶ）。存在しない先は取り消し線＝リンク行と同じ作法
  const refFull=r=>r.cross?r.label:t("lkIssue")+" "+r.label;   // 別案件は「勤怠-2」・同じ案件は「課題 #3」
  function refHtml(r){
    const lb=refFull(r);
    return hasIssue(r.pj,r.id)

  function lkLabel(L,curPn){

  const lkTitle=(L,curPn)=>(L.k==="issue"&&L.pj&&L.pj!==curPn)?issueRef(L.pj,L.id,curPn).title:"";
  function linksRow(is,c){

  const decDelX=(c,di)=>editMode?`<span class="decdel" data-decdel="${c.i}:${di}" title="${esc(t("del"))}">✕</span>`:"";
  function decidedLines(c){

  // 概要の「待ち：」「凍結：」1行（無ければ出さない）

  function closedLine(is,c,inline){
    const cl=obj(is.closed); if(!cl)return "";
    const hl=labelOf(CLOSE_HOWS,str(cl.how));
    let dup="";
    if(str(cl.how)==="duplicate"){

    if(pd.kind!=="waiting")

    if(pd.who.kind==="issue"){   // 待っている相手が課題＝押すとその課題へ飛ぶ
      const r=issueRef(pd.who.pj,pd.who.id,c.pn);
      body=esc(t("waitIssueLine")(MARK1,str(pd.what))).replace(MARK1,refHtml(r))

  // 「方針（未決）」の帯＝decided:null の項目だけ。行頭「・」・（起票日〜）・経過日数
  function openDecBlock(c){
    // `q`（決めるべきこと）が空の項目は帯に出さない（件数＝未決 N は事実のまま数える）。
    // 編集モードでは全部出す＝「＋方針」で足した空の1件をその場で書けるようにする。

      if(!editMode)

      return `<div class="ln odec edit">`
        +`<button type="button" class="dcok" data-decide="${c.i}:${e.i}" title="${esc(t("btnDecideOneTip"))}">${esc(t("btnDecideOne"))}</button>`

        +`<span class="dcuntil" title="${esc(t("decUntilTip"))}">`
        +dateInput(c.i,"until",shortDate(e.until||""),undefined,e.i,t("decUntilPh"))+`</span>`
        +`${metaH}${nd}`
        +`<span class="decdel" data-decdel="${c.i}:${e.i}" title="${esc(t("del"))}">✕</span></div>`;
    };

  }
  const ln=(k,v,link,st)=>`<div class="ln">${st?STAR("starActTip"):""}<span class="lb"${lbTip(k)}>${esc(t(k))}</span>${link?linkify(v):esc(v)}</div>`;
  // 行動1件の中身＝ 済/未 日付 本文 担当：○○（詳細の行と、たたんだ時の次の一手で共用）

  function actBody(a){

                           :`<span class="ad tbd">${esc(t("tbd"))}</span>`;  // date:null＝調整中（未定）

    +(c.starActs.has(e.i)?STAR("starActTip"):`<span class="star"></span>`)
    +actBody(e.a)+`</div>`;

  }
  // 列メタデータ（見出し・幅・セル描画を1エントリに集約＝増えにくい構造）
  const COLS=[
    {key:"no",label:"colNo",w:"46px",cls:"num",view:(is,c)=>esc(c.no)},
    {key:"prio",label:"colPrio",tip:"colPrioTip",w:"68px",cls:"prio",
     view:(is,c)=>editMode
       ?`<select data-i="${c.i}" data-field="priority">`+PRIORITIES.map(p=>`<option value="${p.k}"${c.prio===p.k?" selected":""}>${esc(t(p.l))}</option>`).join("")+`</select>`

     view:(is,c)=>{

  // 1案件ぶんの集計。DOM は作らない（タブのバッジ・サマリ表はこれだけで出す）
  function projStats(sh,TODAY,SR){
    const list=normalizeIssues(sh), SN=projName(sh);
    const cnt={};STATE_ORDER.forEach(k=>cnt[k]=0);
    const mk={};MARK_ORDER.forEach(k=>mk[k]=0);   // 印はすべて「課題数」（待ち・凍結・未決・期限超過・催促・★）
    let next=null;
    list.forEach((is,i)=>{const c=computeIssue(is,i,TODAY,SR,SN);is._calc=c;
      cnt[c.state]++;
      MARK_ORDER.forEach(k=>{if(c.marks.has(k))mk[k]++;});
      if(c.state!=="closed"&&c.due&&(!next||c.due<next))next=c.due;});  // 次の期限＝未完了で最も近い期限
    return {list,cnt,mk,star:mk.star,ovd:mk.ovd,next};
  }
  function renderTabs(projs,stats,summary,ai){

  let bIdx=null,bIdxFor=null;
  function buildBadgeIndex(d){                               // "案件名\u0000WBS id" → [課題] の索引を1回だけ作る
    const m=new Map();
    normalizeProjects(d).forEach(pj=>{
      const from=projName(pj);

        if(!Array.isArray(is.links))return;
        is.links.forEach(l=>{
          const L=linkOf(l); if(!L||L.k!=="wbs")return;
          const k=(L.pj||from)+"\u0000"+L.id;

  function badgeFor(rowKey,tid){                             // rowKey は wbs の "T|案件名|id"

      else if(act==="adel"){if(!arr)return;arr.splice(ai,1);}
      else if(act==="aup")swapAct(is,ai,-1);
      else if(act==="adown")swapAct(is,ai,1);
      else if(act==="aadd"){if(!Array.isArray(is.actions))is.actions=[];
        is.actions.push({date:null,text:"",assignee:"",done:false});}
      else if(act==="adddec"){if(!Array.isArray(is.decisions))is.decisions=[];
        is.decisions.push({q:"",since:todayStr(),decided:null,a:""});}  // 末尾に「未決」を1つ足す
      else if(act==="unpend")is.pending=null;
      else if(act==="reopen")is.closed=null;
      else if(act==="wait"||act==="frozen"||act==="close"){openForm(act,i,b);return;}  // フォームのOKで書く（renderは向こう側で）
      else if(act==="delissue"){
        if(!confirm(t("confirmDelIssue")(str(is.title))))return;
        const raw=curProjObj&&Array.isArray(curProjObj.issues)?curProjObj.issues:null;
        const at=raw?raw.indexOf(is):-1; if(at<0)return;  // 正規化で捨てた要素があっても正しい位置を消す
        raw.splice(at,1);
      }
      else return;
      queueSave(); render(lastData); return;
    }
    const tg=e.target.closest("[data-tog]");  // 折りたたみ（1行 ⇄ 全文）。状態はlocalStorage（キー＝id）
    if(tg){
      const k=tg.getAttribute("data-tog");
      collapsed.has(k)?collapsed.delete(k):collapsed.add(k);
      saveCollapsed(); if(lastData)render(lastData);
    }
  });
  // projects が無いファイル（空の器）でも ＋案件 から書き始められるように配列だけ用意する
  function ensureProjects(){
    if(!okObj(lastData))return false;
    if(!Array.isArray(lastData.projects)){
      // 旧フォーマット {project, milestones, tasks} は projects[0] に畳む
      // （そのまま projects:[] を足すと、計画側が旧形式を読まなくなって表から消えるため）。
      // 畳むのはこの3つだけ。name・holidays・star・`_`キーはトップレベルに残す。
      if(Array.isArray(lastData.tasks)||Array.isArray(lastData.milestones)||typeof lastData.project==="string"){
        const p={name:str(lastData.project)||"WBS"};
        if(Array.isArray(lastData.milestones))p.milestones=lastData.milestones;
        if(Array.isArray(lastData.tasks))p.tasks=lastData.tasks;
        delete lastData.project; delete lastData.milestones; delete lastData.tasks;
        lastData.projects=[p];
      }else lastData.projects=[];
    }
    return true;
  }
  $("isTabBar").addEventListener("click",e=>{
    const dl=e.target.closest("[data-delproj]");
    if(dl){  // 開いている案件を課題ごと削除（最後の1枚も消せる＝projects:[] の空表示）
      const i=+dl.getAttribute("data-delproj"), sh=curProjs[i]; if(!sh)return;
      if(!confirm(t("confirmDelProj")(projName(sh)||t("noName"))))return;
      if(!ensureProjects())return;
      lastData.projects.splice(lastData.projects.indexOf(sh),1);
      const nx=lastData.projects[0];
      tabSel=nx?projName(nx):SUMMARY; lsSet("issProj",tabSel);
      queueSave(); render(lastData); return;
    }
    if(e.target.closest('[data-act="addproj"]')){
      const nm=prompt(t("promptProj"),t("newProj"));
      if(nm===null)return;
      if(!ensureProjects())return;
      lastData.projects.push({name:str(nm)||t("newProj"),issues:[]});
      tabSel=str(nm)||t("newProj"); lsSet("issProj",tabSel);  // 追加後にその案件へ切替
      queueSave(); render(lastData); return;
    }
    const tb=e.target.closest(".stab"); if(!tb)return;
    gotoTab(tb.hasAttribute("data-summary")?SUMMARY:tb.getAttribute("data-tab"));
    if(e.detail===2)renameTab(tb);            // 2発目のクリック＝ダブルクリック
  });
  let renameLock=0;
  function renameTab(tb){                      // タブのダブルクリックで案件名を変更
    if(!editMode)return;
    if(Date.now()-renameLock<400)return;        // click(detail=2) と dblclick の二重発火を抑える
    if(!tb||!tb.hasAttribute("data-tab"))return;
    const i=+tb.getAttribute("data-si"), sh=curProjs[i]; if(!sh)return;
    renameLock=Date.now();
    const nm=prompt(t("promptRename"),projName(sh));
    if(nm===null)return;
    if(!ensureProjects())return;
    sh.name=str(nm);
    tabSel=sh.name; lsSet("issProj",tabSel);
    queueSave(); render(lastData);
  }
  $("isTabBar").addEventListener("dblclick",e=>{renameTab(e.target.closest(".stab[data-tab]"));});
  $("isStat").addEventListener("click",e=>{calBtnClick(e);});
  $("isStat").addEventListener("change",e=>{  // ★の対象期間を直す（from が空になったら既定に戻す＝キーごと削除）
    const el=e.target;
    if(calProxyChange(el))return;
    const f=el.getAttribute&&el.getAttribute("data-star"); if(!f)return;
    if(!lastData||typeof lastData!=="object"||Array.isArray(lastData))return;
    const cur=obj(lastData.star)||{};
    const iso=expandDate(el.value,isDate(cur[f])?cur[f]:null);
    if(iso===null)return;  // 解釈不能・範囲外は無視（ゴミを保存しない）
    const nx={from:isDate(cur.from)?cur.from:"",to:isDate(cur.to)?cur.to:""};
    nx[f]=iso;
    if(!nx.from)delete lastData.star;  // 既定（直近7日）に戻す＝JSONに既定値を書かない
    else{const o={from:nx.from};if(nx.to)o.to=nx.to;lastData.star=o;}
    queueSave(); deferRender();
  });
  function addIssue(){  // ＋課題＝末尾に追加（id=最大+1・起票日=本日・優先度=中）→その行へ飛んで書き始められる
    if(!lastData||!curProjObj)return;
    if(!Array.isArray(curProjObj.issues))curProjObj.issues=[];  // 番号(id)は案件ごと
    const ids=curProjObj.issues.map(x=>x&&typeof x==="object"?Number(x.id):NaN).filter(n=>Number.isFinite(n));
    const nid=(ids.length?Math.max(...ids):0)+1;  // 空でも NaN にならないよう 0 起点
    curProjObj.issues.push(newIssue(nid));
    const key=projName(curProjObj)+"|"+nid;
    if(collapsed.has(key)){collapsed.delete(key);saveCollapsed();}
    queueSave(); render(lastData);
    const tr=rowByKey(key);
    if(!tr)return;
    tr.scrollIntoView({block:"center"});
    document.querySelectorAll("#isTbody tr.jump").forEach(x=>x.classList.remove("jump"));
    tr.classList.add("jump"); clearTimeout(jumpTimer);
    jumpTimer=setTimeout(()=>{tr.classList.remove("jump");},2000);
    const inp=tr.querySelector('td.title input[data-field="title"]');
    if(inp){inp.focus();inp.select();}
  }
  $("isThead").addEventListener("click",e=>{  // ▼/▶＝全展開／全たたみ
    if(e.target.id!=="isAllCaret"||!lastData)return;
    const keys=curIssues.map(is=>is._calc.key);
    if(keys.some(k=>!collapsed.has(k)))keys.forEach(k=>collapsed.add(k)); else keys.forEach(k=>collapsed.delete(k));
    saveCollapsed(); render(lastData);
  });

  // ===== フィルタバー（表示専用＝押すと render() で行を間引く/並べ替えるだけ・データ不変） =====
  const SF_AXES=[  // is-sf-btn 軸の定義テーブル（data-属性名・トグル処理）。if-else 分岐の代わり
    {attr:"data-state",toggle:k=>{stateOn.has(k)?stateOn.delete(k):stateOn.add(k);lsSet("issStateFilter",JSON.stringify([...stateOn]));}},
    {attr:"data-prio", toggle:k=>{prioOn.has(k)?prioOn.delete(k):prioOn.add(k);lsSet("issPrioFilter",JSON.stringify([...prioOn]));}},
    {attr:"data-mark",toggle:k=>{markOn.has(k)?markOn.delete(k):markOn.add(k);lsSet("issMarkOn",JSON.stringify([...markOn]));}},
  ];
  const saveAsg=()=>lsSet("issAsgOff",JSON.stringify([...asgOff]));
  const pill=(attr,k,on,label,tip,solo)=>`<button class="is-sf-btn${solo?" is-sf-solo":""}${on?" on":""}" ${attr}="${esc(k)}" title="${esc(tip)}">${esc(label)}</button>`;
  function renderFilterBar(){
    const el=$("isStateFilter"); if(!el)return;
    const dd=el.querySelector(".is-asg-dd"), wasOpen=!!(dd&&dd.open);  // ドロップダウンの開閉状態を保持
    let h=`<span class="is-sf-lbl">${esc(t("fState"))}</span>`
      +STATE_ORDER.map(k=>pill("data-state",k,stateOn.has(k),t(STATES.find(s=>s.k===k).l),t("fStateTip"))).join("");
    h+=`<span class="is-sf-sep"></span><span class="is-sf-lbl">${esc(t("fPrio"))}</span>`
      +PRIORITIES.map(p=>pill("data-prio",p.k,prioOn.has(p.k),t(p.l),t("fPrioTip"))).join("");
    if(asgList.length){  // 担当＝データ内担当のチェックリスト（複数選択・軸内OR）
      const sel=asgList.filter(a=>!asgOff.has(a));
      const badge=sel.length===asgList.length?t("fAsgAll"):sel.length===1?(sel[0]||t("fAsgNone")):`(${sel.length})`;
      const opts=asgList.map(a=>`<label><input type="checkbox" class="is-asg-cb" data-asg="${esc(a)}"${asgOff.has(a)?"":" checked"}><span>${esc(a||t("fAsgNone"))}</span></label>`).join("");
      h+=`<span class="is-sf-sep"></span><details class="is-asg-dd"${wasOpen?" open":""}><summary title="${esc(t("fAsgTip"))}">${esc(t("fAsg"))} <span class="is-asg-cnt">${esc(badge)}</span></summary>`
        +`<div class="is-asg-list"><div class="is-asg-acts"><button type="button" class="is-asg-all">${esc(t("fAsgSelAll"))}</button><button type="button" class="is-asg-none">${esc(t("fAsgClear"))}</button></div>${opts}</div></details>`;
    }
    h+=`<span class="is-sf-sep"></span><span class="is-sf-lbl">${esc(t("fMark"))}</span>`
      +MARK_ORDER.map(k=>pill("data-mark",k,markOn.has(k),t(MK_FLBL[k]),t("fMarkTip"),true)).join("");
    h+=`<span class="is-sf-sep"></span><span class="is-sf-lbl">${esc(t("sortLbl"))}</span><span class="is-seg" title="${esc(t("sortTip"))}">`
      +SORTS.map(s=>`<button class="is-seg-btn${sortKey===s.k?" on":""}" data-sort="${s.k}">${esc(t(s.l))}</button>`).join("")+`</span>`;
    if(editMode&&curProjObj)  // ＋課題は絞り込みバーの右端（表の下ではなく、常に見える位置に）
      h+=`<button type="button" class="ebtn addissue" data-act="addissue" title="${esc(t("addIssueTip"))}">${ICN.add}${esc(t("addIssue"))}</button>`;
    el.innerHTML=h;
  }
  const refreshFilters=()=>{if(lastData)render(lastData);else renderFilterBar();};
  $("isStateFilter").addEventListener("click",e=>{
    if(e.target.closest('button[data-act="addissue"]')){addIssue();return;}
    const sf=e.target.closest(".is-sf-btn");
    if(sf){const ax=SF_AXES.find(a=>sf.hasAttribute(a.attr));if(ax)ax.toggle(sf.getAttribute(ax.attr));refreshFilters();}
    else if(e.target.closest(".is-asg-all")){asgOff.clear();saveAsg();refreshFilters();}
    else if(e.target.closest(".is-asg-none")){asgOff.clear();asgList.forEach(a=>asgOff.add(a));saveAsg();refreshFilters();}
    else if(e.target.closest(".is-seg-btn")){sortKey=e.target.closest(".is-seg-btn").getAttribute("data-sort");lsSet("issSort",sortKey);refreshFilters();}
  });
  $("isStateFilter").addEventListener("change",e=>{
    const cb=e.target.closest(".is-asg-cb"); if(!cb)return;
    const a=cb.getAttribute("data-asg");
    cb.checked?asgOff.delete(a):asgOff.add(a);
    saveAsg(); refreshFilters();
  });

  // ===== [統合] 言語は wbs 側の切替に追随する（課題側は言語ボタンを持たない） =====
  function applyLang(){
    const fb=document.querySelector("#isFilterBar .fbar-ttl"); if(fb)fb.textContent=t("fBar");
    const em=document.getElementById("isEmpty"); if(em)em.innerHTML=t("empty");
    // 凡例は課題側が操作バーへ足したボタン＝ここで言語を追随させる（wbs 側のボタンには触らない）
    document.querySelectorAll("[data-legend]").forEach(b=>{b.textContent=t("legend");b.title=t("legendTip");});
    renderFilterBar();
  }
  lang=PM.lang();
  applyLang();
  applyView();   // 起動時にも走らせる＝ファイルを開く前から「計画｜課題」を出す
  handleHash();
})();
</script>
