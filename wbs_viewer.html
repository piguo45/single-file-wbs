<html lang="ja">
<head>

<title>WBS Viewer</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHZpZXdCb3g9IjAgMCAyMCAyMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIxMCIgY3k9IjEwIiByPSI5LjYiIGZpbGw9IiMxZTJmNjMiLz48cmVjdCB4PSI0LjIiIHk9IjQuOCIgd2lkdGg9IjcuNSIgaGVpZ2h0PSIyLjciIHJ4PSIxIiBmaWxsPSIjN2RhNGY3Ii8+PHJlY3QgeD0iNiIgeT0iOC42IiB3aWR0aD0iOS4zIiBoZWlnaHQ9IjIuNyIgcng9IjEiIGZpbGw9IiNjZGQ5ZjUiLz48cmVjdCB4PSI0LjgiIHk9IjEyLjQiIHdpZHRoPSI1LjgiIGhlaWdodD0iMi43IiByeD0iMSIgZmlsbD0iIzdkYTRmNyIvPjxwb2x5bGluZSBwb2ludHM9IjEyLjgsMy4yIDkuOCw5LjYgMTMuOCwxMS4yIDEwLjgsMTYuOCIgc3Ryb2tlPSIjZTExZDQ4IiBzdHJva2Utd2lkdGg9IjEuOCIgZmlsbD0ibm9uZSIvPjwvc3ZnPg==">
<style>
  :root{
    --day-w:22px; --row-h:30px; --header-h:48px; --tab-h:22px; --pv-pad:14px;
    --border:#d7dbe0; --btn-border:#9aa2ad; --grid:#eceef1; --line:#c5cad3; --weekend:#fbeef1;  /* line=表の区切り（縦横共通・青帯と色相で区別できるグレー）。--grid はガント日グリッド用 */  /* btn-border=操作物の輪郭（罫線より濃く・WCAG非テキスト3:1寄り） */
    --text:#1f2430; --muted:#6b7280; --ym-fg:#11161f;  /* 年月ラベル: 日付の数字(--text)より一段濃い=月>日の階層 */
    --actual-soft:#6872b1; --short-soft:#b15a5d;  /* 進捗タブ専用の実績/不足色（#106）。進捗タブは全行が0-100%のフル幅バーで色の面積が時間タブの数倍あり、
       原色のままだと画面が重い。色相と明度(L*)は --actual/#e11d48 と同値のまま彩度(C*)だけ50%落とす＝意味色は不変で圧だけ下げる（薄くすると弱く見えるので明度は動かさない）。
       圧の元は彩度と面積の両方なので、バー高も 14/8px→10/6px に細くして併せて減らす */
    --actual:#2f6fed;  /* 実績は全階層で同色（親もリーフも同じ＝何のバーか一目で分かる・#65）。階層は行背景＋左表で表現 */
    --proj:#93acdf; --proj-line:#3a5694; --lvl0:#b9cdf2; --lvl1:#e3ebfb;
    --done-bg:#d4dae1; --done-fg:#5f6772; --accent:#2563eb; --edit-on:#16a34a;
    --plan-edge:#4a6a9e; --pspan:#5b78bd; --head-bg:#eef0f3;  /* plan-edge=予定の枠線（4辺・前面・塗りなし）。遅延/完了を色分けしたので枠でもプログレスバー誤認しない・#65 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
       color:var(--text);background:#f7f8fa;display:flex;flex-direction:column;font-size:12px}
  #topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 12px;
          background:#fff;flex-wrap:wrap}
  #topbar .title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px;line-height:1.15;cursor:pointer}  /* クリックで簡素表示トグル(#79) */
  #topbar .tdiv{width:1px;align-self:stretch;margin:5px 2px;background:var(--border)} /* 呼称｜操作の区切り。上下を少し空けて柔らかく */
  #topbar .title .ver{font-size:9px;color:var(--muted);font-weight:400}
  body.plain #brandTitle .logo,body.plain #brandTitle .brand-x,body.plain #brandTitle .ver{display:none}  /* 簡素モード=ロゴ/版/“Viewer”を隠し「WBS」だけ。現場で“自作”と言える逃げ道(#79) */
  #topbar button{font:inherit;padding:5px 10px;border:1px solid var(--btn-border);background:#fff;border-radius:6px;cursor:pointer;
                 align-self:center} /* 指標ブロックが高くてもボタンは伸びない。操作3ボタンの高さは下の規則で統一 */
  #topbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  #openBtn{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:3px 12px}
  #openBtn,#refreshBtn,#editBtn{height:40px} /* 操作3ボタンは同一高（2行の「開く」基準）。指標ブロックの高さに引きずられない */
  #openBtn .sub{font-size:9px;opacity:.8}
  #openBtn.over{background:#eef4ff!important;border:1px dashed var(--accent)!important;color:var(--accent)!important} /* ドラッグ中だけ「落とせる」点線合図 */
  #topbar #langBtn{border-color:transparent;background:transparent;color:var(--muted)} /* 表示設定＝データ操作より弱く・右端 */
  #topbar #langBtn:hover{border-color:var(--btn-border);background:#fff}
  #filterBar{display:none;align-items:center;gap:10px;padding:5px 12px;border-bottom:1px solid var(--line);background:#f4f6f9} /* フィルタバー(#91)＝左の情報表の真上・表示専用の絞り込み */
  #filterBar .fbar-ttl{font-size:11px;font-weight:600;color:var(--muted)}
  .sfilter{display:inline-flex;align-items:center;gap:4px}                       /* 状態フィルタ(#91)＝表示専用トグル */
  .sfilter .sf-lbl{font-size:11px;color:var(--muted)}
  .sf-btn{font:inherit;font-size:11px;padding:2px 8px;border:1px solid var(--btn-border);background:#fff;border-radius:11px;cursor:pointer;color:var(--muted)} /* ピル形＝操作ボタン(角丸6px)と区別 */
  .sf-btn.on{background:#eef4ff;border-color:var(--accent);color:var(--accent)}  /* 表示中＝薄い青。既定は全ONで穏やか(Deference) */
  .sf-btn:not(.on){text-decoration:line-through;opacity:.6}                      /* 非表示＝取り消し線で色以外でも分かる(CUD冗長化) */
  .sfilter .sf-sep{width:1px;align-self:stretch;background:var(--border);margin:2px 2px} /* 状態｜遅延 の軸区切り */
  .sf-btn.sf-solo:not(.on){text-decoration:none;opacity:1}                       /* 単独トグル(遅延)＝"非表示状態"ではないので取り消し線なし */
  .sf-btn.sf-solo.on{background:#fdecef;border-color:#d94f72;color:#b23a5b}       /* 遅延ON＝赤系(意味色:遅延=赤)。形(ピル)＋ラベルでも冗長化 */
  .asg-dd{position:relative;display:inline-block}                                /* 担当(#93)＝ドロップダウン。可変多数はピルでなくチェックリストに収納 */
  .asg-dd>summary{list-style:none;cursor:pointer;font:inherit;font-size:11px;padding:2px 8px;border:1px solid var(--btn-border);border-radius:11px;background:#fff;color:var(--muted)}
  .asg-dd>summary::-webkit-details-marker{display:none}
  .asg-dd[open]>summary{background:#eef4ff;border-color:var(--accent);color:var(--accent)}
  .asg-dd .asg-cnt{font-weight:600}
  .asg-list{position:absolute;top:100%;left:0;z-index:20;margin-top:3px;background:#fff;border:1px solid var(--btn-border);border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:6px;min-width:120px;max-height:240px;overflow:auto}
  .asg-list label{display:flex;align-items:center;gap:5px;font-size:12px;padding:2px 4px;white-space:nowrap;cursor:pointer}
  .asg-list .asg-acts{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}
  .asg-list .asg-acts button{font:inherit;font-size:10px;padding:1px 6px;border:1px solid var(--btn-border);border-radius:4px;background:#fff;cursor:pointer;color:var(--muted)}
  .sfilter .seg{display:inline-flex;border:1px solid var(--btn-border);border-radius:11px;overflow:hidden}  /* 期間(#94)＝単一選択セグメント（連結ボタン） */
  .seg-btn{font:inherit;font-size:11px;padding:2px 8px;border:none;border-left:1px solid var(--btn-border);background:#fff;color:var(--muted);cursor:pointer}
  .seg-btn:first-child{border-left:none}
  .seg-btn.on{background:var(--accent);color:#fff}                               /* 選択中＝塗り（単一選択を明示） */
  #stat{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;color:var(--muted);line-height:1.18}
  #stat b{color:var(--text)}
  #stat .mrows{display:inline-block;text-align:left;font-variant-numeric:tabular-nums}
  #stat .mrow{font-size:12px;color:var(--text);cursor:help}
  #stat .mrow .mk{color:var(--muted)} #stat .mrow .mv{display:inline-block;min-width:74px}
  #stat .mrow .mev{color:var(--actual)} #stat .mrow .mdl{color:#e11d48;font-weight:700}
  #stat .mrow .msub{color:var(--muted);font-size:11px}
  #stat .mdrow .mv2{display:inline-block}  /* 遅延行：バッジ群は値列(.mv)と同じ開始位置に揃う（.mkが全行同幅） */
  #stat .mdrow .dbadge{margin-right:6px;padding:1px 7px;border-radius:8px;background:#fdecea;color:#c01a2b;font-size:11px;font-weight:600;white-space:nowrap} /* 遅延件数バッジ（期限/進捗）。11pxの方が視認性が良い・件数0種別は非表示 */
  #stat .mstat{font-size:11px;color:var(--muted);margin-top:1px;align-self:stretch;text-align:right;white-space:nowrap}
  #stat .mstat span{cursor:help}
  #main{flex:1 1 auto;display:flex;min-height:0;background:#fff}
  #left{flex:0 0 auto;overflow-y:auto;overflow-x:hidden}   /* 左右の縦区切りはヘッダ＋行に引く（白帯=.htab-sp には引かない＝タブの上に線が突き出さない） */
  #left::-webkit-scrollbar{display:none} #left{scrollbar-width:none}
  #right{flex:1 1 auto;overflow:auto;position:relative}
  #right.pview{overflow-x:hidden}   /* 進捗ビュー＝0-100%を幅に収めて全表示（横スクロール無し・左の折りたたみで幅が変われば追従） */
  .head{height:var(--header-h);position:sticky;top:0;z-index:4;background:var(--head-bg);border-bottom:2px solid var(--border)}
  #leftHead{display:flex}
  #leftHead .h{padding:4px 5px;border-right:1px solid var(--border);font-weight:600;
               display:flex;align-items:center;justify-content:center;height:var(--header-h);white-space:nowrap}
  #leftHead .hg{height:var(--header-h);border-right:1px solid var(--border);display:flex;flex-direction:column}
  #leftHead .hgt{height:50%;display:flex;align-items:center;justify-content:center;font-weight:600;
                 border-bottom:1px solid var(--border)}
  #leftHead .hgb{height:50%;display:flex}
  #leftHead .hsub{display:flex;align-items:center;justify-content:center;font-weight:600;
                  white-space:nowrap;border-right:1px solid var(--border)}
  #leftHead .hsub:last-child{border-right:none}
  #leftHead .h,#leftHead .hsub{position:relative;user-select:none}
  .col-resizer{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:8}  /* 列幅ドラッグの掴み代（境界線の左右3px）。ダブルクリックで既定幅に戻す */
  .col-resizer:hover::after{content:"";position:absolute;left:2px;top:0;width:3px;height:100%;background:var(--accent)}  /* ホバー時だけ細い青線（新色は足さず --accent を再利用） */
  body.resizing-cols{cursor:col-resize;user-select:none}
  #leftHead .h.h2l{flex-direction:column;justify-content:flex-start;line-height:1.25;
                   padding-top:calc(var(--header-h)/2 - .625em)} /* 1行目の中心=他の単行列名と同じ中央線（.625em=行高1.25の半分） */
  #leftHead .h .unit{font-size:9px;color:var(--muted);margin-left:1px}
  .lrow{display:flex;height:var(--row-h);border-bottom:1px solid var(--line)}
  .lrow .c{padding:0 5px;border-right:1px solid var(--line);display:flex;align-items:center;
           overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .lrow .c.r{justify-content:flex-end;font-variant-numeric:tabular-nums}
  .lrow .c.num{justify-content:flex-end;color:var(--muted)}
  .lrow .c.note{color:var(--muted)}
  .lrow .c.note a{color:var(--accent)}
  .lrow .c.prog{justify-content:center}
  .lrow .c.stat{justify-content:flex-end}
  .stp{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}   /* 進捗 ◀ N% ▶ ステッパー */
  .stp .v{min-width:34px;text-align:right;font-size:12px}
  .stp.auto .v{color:var(--muted)}                                              /* 親=自動集計（読み取り・連続値） */
  .stp button{width:18px;height:18px;line-height:1;border:1px solid var(--btn-border);background:#f3f6fb;border-radius:4px;font-size:11px;color:#3a5694;padding:0;cursor:pointer}
  .stp button:hover{background:#e6eefb}
  .s-d{color:#e11d48;font-weight:700}.s-a{color:var(--actual)}.s-p{color:var(--text)}.s-x{color:var(--text)}  /* 状況: 遅=赤/実=青/予=黒(区切りも黒) */
  .c.overdue{color:#e11d48;font-weight:600}                                     /* 予定終了の締切超過=赤 */
  .prow{background:var(--proj);font-weight:700;border-top:3px solid var(--proj-line);border-bottom:2px solid var(--proj-line)}
  .lvl0{background:var(--lvl0)} .lvl1{background:var(--lvl1)} .lvl2{background:#fff}
  .lrow.lvl0{font-weight:700} .lrow.lvl1{font-weight:600}
  .lrow.done{background:var(--done-bg);color:var(--done-fg)}
  .lrow.done .nm{text-decoration:line-through}
  .caret{display:inline-block;width:15px;color:#3b4654;user-select:none;text-align:center}
  .caret-sp{display:inline-block;width:15px}
  /* 編集モード */
  #editBtn.on{background:var(--edit-on);color:#fff;border-color:var(--edit-on)}
  #leftRows input{font:inherit;width:100%;min-width:0;box-sizing:border-box;border:1px solid #c3c9d2;
                  border-radius:4px;padding:1px 3px;background:#fff;color:var(--text)}
  #leftRows .c.r input{text-align:right}
  .nm-wrap{display:flex;align-items:center;gap:2px;width:100%;min-width:0;align-self:stretch}
  .nm-wrap .clk.caret{align-self:stretch;display:flex;align-items:center;justify-content:center;width:20px}  /* 編集時の折りたたみは caret のみ＝行高いっぱいにヒット領域を拡大 */
  #leftRows input.nm-in{flex:1 1 auto;width:auto}  /* #leftRows input{width:100%} のID詳細度に勝つためセレクタで上書き（!important回避） */
  .done-mark{color:var(--done-fg);flex:0 0 auto}
  .donechk{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;flex:0 0 auto;  /* 完了トグル：既存の✓トーン(done-fg)を踏襲 */
           margin-right:3px;padding:0;border:1px solid var(--btn-border);border-radius:3px;background:#fff;
           cursor:pointer;font-size:11px;line-height:1;color:var(--done-fg)}
  .donechk.on{border-color:var(--done-fg)}
  .donechk:hover{border-color:var(--accent)}
  .acts,.movegrp{display:inline-flex;gap:2px;flex:0 0 auto}
  .movegrp{margin-right:3px}   /* 移動⬆⬇はチェックの前・横並び独立（穂先が大きく視認しやすい・＋✕と同サイズ） */
  .acts button,.movegrp button{font:inherit;font-size:12px;line-height:1.3;padding:2px 6px;border:1px solid var(--btn-border);
               background:#fff;border-radius:3px;cursor:pointer;color:#445;display:inline-flex;align-items:center;justify-content:center}
  .movegrp button,.acts button[data-act="add"],.acts button[data-act="addchild"],.acts button[data-act="del"],.acts button[data-act="resched"]{padding:2px 3px}  /* アイコンボタンは横を詰めて名前入力に幅を返す（＋タスクのテキストは据え置き）・#49 */
  .bar.plan[data-rslog]{cursor:pointer}  /* リスケ済みバー=クリックで履歴(#96) */
  .ic{width:13px;height:13px;flex:0 0 auto}                 /* インラインSVGアイコン（currentColor）・#49 */
  .acts .ic,.movegrp .ic{width:12px;height:12px}            /* 行内アイコンは少し小さく */
  #stat .mstat .ic{width:12px;height:12px;vertical-align:-2px;margin-right:1px}  /* メタ行は文字に揃える */
  .acts button:hover,.movegrp button:hover{background:#eef2ff;border-color:#9db4f0}
  .acts button[data-act="del"]{margin-left:5px}   /* 破壊的操作の✕は少し離して誤クリック防止 */
  .date-wrap{display:flex;align-items:center;gap:2px;width:100%;min-width:0}
  #leftRows .date-wrap input[type="text"]{flex:1 1 auto;width:auto}  /* #leftRows input{width:100%} に勝つ詳細度（.nm-in と同じ理由） */
  .cal-proxy{position:absolute;width:0;height:0;opacity:0;border:0;padding:0;margin:0;pointer-events:none}
  .cal-btn{flex:0 0 auto;font-size:11px;line-height:1.2;padding:2px 3px;border:1px solid var(--btn-border);
           background:#fff;border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#445}
  .clk{cursor:pointer}
  #leftHead .h[title]{cursor:help}   /* 押せない説明ツールチップは ?（押せるボタンは pointer のまま）・#46 */
  .msrow{height:var(--row-h);background:#fbfcfe}                              /* 編集モードのマイルストーン編集行 */
  .ms-edit{display:flex;align-items:center;gap:3px;width:100%;padding:0 6px;min-width:0}
  .ms-edit .ms-tag{color:#8a5a78;font-size:11px;font-weight:600;flex:0 0 auto;white-space:nowrap}  /* 行の種別＝マイルストーン */
  .ms-edit .date-wrap{flex:0 0 auto;width:92px}
  #leftRows input.ms-label{flex:0 0 auto;width:200px}                        /* #leftRows input{width:100%} のID詳細度に勝つ（nm-inと同じ理由）＝右の色/✕を画面外に押し出さない */
  .ms-edit input{font:inherit;font-size:12px;border:1px solid var(--btn-border);border-radius:3px;padding:2px 4px;min-width:0;color:#445}
  .ms-edit .ms-sws{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto}  /* 色は5プリセットから選択（CUD安全） */
  .ms-sw{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.25);cursor:pointer;padding:0;flex:0 0 auto}
  .ms-sw.on{outline:2px solid #333;outline-offset:1px}
  .ms-edit button[data-act="delms"]{flex:0 0 auto;border:1px solid var(--btn-border);background:#fff;border-radius:3px;cursor:pointer;color:#445;display:inline-flex;align-items:center;justify-content:center;padding:2px 3px}
  #rightHead{position:sticky;top:0;z-index:4;background:var(--head-bg);border-bottom:2px solid var(--border)}
  #ym{display:flex;height:18px;border-bottom:1px solid var(--border)}
  #ym .seg{border-right:1px solid #c8ccd2;font-size:11px;white-space:nowrap;
           display:flex;align-items:center;justify-content:center;background:#e9ebef;overflow:hidden;color:var(--ym-fg)}
  #dates{display:flex;height:30px}
  #dates .d{width:var(--day-w);border-right:1px solid var(--grid);text-align:center;line-height:1.05;padding-top:3px;font-size:10px}
  #dates .d.sat,#dates .d.sun,#dates .d.hol{background:var(--weekend)}   /* 土日/祝日のヘッダ＝列(.we)と同じ薄ピンク＝列まるごと統一 */
  #dates .d .dow{font-size:9px;color:var(--muted)}
  #dates .d.sat .dow{color:var(--accent)}#dates .d.sun .dow{color:#dc2626}
  #dates .d.hol{color:#dc2626}#dates .d.hol .dow{color:#dc2626}   /* 祝日=赤字（日付/曜日）。土=青字・日=赤字の慣習は維持 */
  #dates .d.hl{background:#dbe7ff;font-weight:700}
  #colHl{position:absolute;top:0;bottom:0;width:var(--day-w);pointer-events:none;display:none;z-index:3;
         background:rgba(37,99,235,.08);border-left:1px solid rgba(37,99,235,.35);border-right:1px solid rgba(37,99,235,.35)}
  #rowHl{position:absolute;left:0;right:0;height:var(--row-h);pointer-events:none;display:none;z-index:3;
         background:rgba(37,99,235,.06);border-top:1px solid rgba(37,99,235,.30);border-bottom:1px solid rgba(37,99,235,.30)}
  #leftRows .lrow.hl{box-shadow:inset 0 0 0 999px rgba(37,99,235,.06)}  /* 十字の横：対象行を薄く塗る（inset影で階層色の上に重ねる・ガント帯と同トーン） */
  #leftRows{position:relative;border-right:2px solid var(--border)}
  #leftColHl{position:absolute;top:0;bottom:0;pointer-events:none;display:none;z-index:3;  /* 十字の縦（左表側）：マウスがいるデータ列を薄く塗る */
             background:rgba(37,99,235,.06);border-left:1px solid rgba(37,99,235,.30);border-right:1px solid rgba(37,99,235,.30)}
  #rightBody{position:relative}
  /* タブは白帯の中に置き、グレーのヘッダ（年月/罫線）の上に突き出す。左には同高の白スペーサで行を揃える＝灰色の広がりを出さない */
  .htab-sp{height:var(--tab-h);position:sticky;top:0;z-index:5;background:#fff}  /* 列折りたたみ +/− の薄い1段（列ヘッダの真上・+/−は絶対配置） */
  .htab-sp .ctglb{position:absolute;bottom:1px;transform:translateX(-50%);width:15px;height:15px;padding:0;line-height:12px;font-size:13px;font-weight:700;color:#666;background:#fff;border:1px solid #c3ccda;border-radius:3px;cursor:pointer}
  .htab-sp .ctglb:hover{background:#eef2ff;border-color:#9db4f0;color:#2563eb}
  #rtabs{position:sticky;top:0;left:0;z-index:6;height:var(--tab-h);display:flex;align-items:flex-end;gap:3px;padding-left:8px;background:#fff}
  .rtab{padding:2px 16px 3px;font-size:12px;color:#8b94a3;background:#eceef2;border:1px solid #d4dae3;border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;line-height:1.3} /* 非選択=灰で沈める */
  .rtab.on{background:#fdf2cc;color:var(--text);font-weight:600;border-color:#ead9a0;box-shadow:inset 0 2px 0 #e0a82e} /* 選択=淡クリーム+アンバー上線（データの青/赤/灰と被らないUI専用色） */
  #leftHead{top:var(--tab-h);border-right:2px solid var(--border)}
  #rightHead{top:var(--tab-h)}
  #rightHead.phead{height:var(--header-h)}
  #pctaxis{position:relative;height:100%}
  #pctaxis .pcta-in,#progbody .prw-bars{position:absolute;left:var(--pv-pad);right:var(--pv-pad);top:0;bottom:0}  /* 0/100%の両脇に余白（軸ラベル・バーを内側にインセット） */
  #pctaxis .ptk{position:absolute;bottom:5px;font-size:11px;color:var(--ym-fg);transform:translateX(-50%)}   /* 文字サイズ・濃さを時間ビューの年月と同じに */
  #pctaxis .ptk.e0{transform:none}                                              /* 0%は左端寄せ（見切れ防止） */
  #pctaxis .ptk.e100{transform:translateX(-100%)}                               /* 100%は右端寄せ */
  /* 進捗ビュー：青=実績(EV)／赤=予定への不足分(slip)。行背景は左と同じ（完了=灰色・階層色）。黒点線=目盛り */
  #progbody{position:relative}
  #pgrid{position:absolute;inset:0 var(--pv-pad);pointer-events:none;z-index:3}  /* 目盛りはバーの上（ルーラー）。両脇は余白に合わせてインセット */
  #pgrid .pgl{position:absolute;top:0;bottom:0;width:0;border-left:1px dotted #555}  /* 黒点線の目盛り（25/50/75/100%） */
  .prw{height:var(--row-h);position:relative;border-bottom:1px solid var(--grid)}
  .prw.prow{background:var(--proj)} .prw.lvl0{background:var(--lvl0)} .prw.lvl1{background:var(--lvl1)}
  .prw.done{background:var(--done-bg)}                                           /* 完了=灰色（左の行と同じ・後勝ちで階層色に優先） */
  .ptrack{position:absolute;left:0;width:100%;top:10px;height:10px;background:#eef1f7;border:1px solid #cdd8ea;z-index:0} /* 0-100%の青グレー下地（無地）。直角＝角丸の時間ビューと形でも区別 */
  .ptick{position:absolute;left:0;width:100%;top:10px;height:6px;z-index:2;pointer-events:none;
         background:repeating-linear-gradient(to right,transparent 0,transparent calc(10% - 1px),#555 calc(10% - 1px),#555 10%,transparent 10%,transparent 20%)} /* 細目盛り＝主目盛り(20%点線)の中間 10/30/50/70/90% だけ（20%位置は点線と重ねない）。上端から6割の短い線・同色#555・バー前面 */
  .prw.thin .ptick{top:12px;height:4px}
  .prw.thin .ptrack{top:12px;height:6px}
  .pbar{position:absolute;top:10px;height:10px;z-index:1}                        /* 子=10px＝時間ビューの実績バー(14px)より細い（面積を減らす・#106） */
  .pbar.act{left:0;background:var(--actual-soft)}                                /* 進捗タブ専用色（#106）。直角＝角丸の時間ビューと形でも区別 */
  .pbar.short{background:var(--short-soft)}                                      /* 不足分=進捗タブ専用の赤（#106・時間タブの遅延赤と同じ色相/明度） */
  .prw.done .pbar.act{background:#8c98a6}                                        /* 完了=グレー（ガント実績バーと統一） */
  .prw.thin .pbar{top:12px;height:6px}                                           /* 親=集計=6px＝時間ビューの親サマリー(8px)より細い（#106） */
  #ganttBg{position:absolute;top:0;left:0;z-index:0}   /* 月の区切り線(.mline)用。土日/祝日の列塗りは行背景に隠れるためオーバーレイ(#overlay rect)で全高に出す */
  #ganttBg .mline{position:absolute;top:0;bottom:0;width:1px;background:#dfe2e6}
  #grows{position:relative;z-index:1}
  .grow{height:var(--row-h);border-bottom:1px solid var(--line);position:relative}
  .grow.prow{background:var(--proj);border-top:3px solid var(--proj-line);border-bottom:2px solid var(--proj-line)}
  .grow.lvl0{background:var(--lvl0)} .grow.lvl1{background:var(--lvl1)}
  .grow.done{background:var(--done-bg)}
  .bar{position:absolute;border-radius:3px}
  /* 予定=薄い背景帯(ゾーン)／実績=塗りバー(前面)。枠＋塗り＝プログレスバー誤認を避ける(#65)。終了遅延=超過分を赤・着手遅れ=空きを薄赤 */
  .bar.plan{top:5px;height:20px;background:transparent;border:2px solid var(--plan-edge);border-radius:4px;z-index:2}  /* 予定=塗りなしの枠（前面・4辺）。実績/遅延が枠を超える/空くで予実差が見える。色分け済みなのでプログレスバー誤認しない・#65 */
  .bar.actual{top:8px;height:14px;background:var(--actual);z-index:1}
  .bar.actual.cut{border-radius:3px 0 0 3px}                                 /* 超過がある時は右角を直角に（赤と連続させる） */
  .bar.over{top:8px;height:14px;background:#e11d48;border-radius:0 3px 3px 0;z-index:1}                   /* 終了遅延=予定終了の超過分（枠の右を超える分・赤+N）。着手遅れは枠の左が空くことで表現＝専用バー不要 */
  .delay{position:absolute;top:-4px;font-size:10px;font-weight:700;color:#e11d48;white-space:nowrap;z-index:4;line-height:16px}  /* バーの上に出す＝本日付近を走るイナズマ線と被らない。枠(z2)より前面 */
  /* リスケ履歴(#96)＝直近の修正1本のトレイル。下レーン=開始の変化・上レーン=終了の変化（出る場所で修正種別が読める） */
  .rs-seg{position:absolute;top:26px;border-top:2px dotted #9aa2ad;z-index:1}
  .rs-seg.top{top:2px}
  .rs-knob{position:absolute;top:24px;width:5px;height:5px;border-radius:50%;background:#9aa2ad;z-index:1}
  .rs-knob.top{top:0}
  .rs-arr{position:absolute;top:19px;color:#9aa2ad;font-weight:700;font-size:12px;line-height:1;z-index:1}
  .rs-arr.top{top:-3px}
  .rsbdg{font:inherit;font-size:10px;padding:0 4px;margin-left:4px;border:none;background:transparent;color:#6b7280;cursor:pointer;border-radius:4px}  /* ↷N=修正回数。クリックで吹き出し */
  .rsbdg:hover{background:#eef4ff;color:var(--accent)}
  #rsPop,#rsForm{position:fixed;z-index:60;background:#fff;border:1px solid var(--btn-border);border-radius:8px;
    box-shadow:0 3px 12px rgba(0,0,0,.18);padding:8px 12px;font-size:12px;line-height:1.7;color:var(--text);max-width:560px}
  #rsPop .rsp-row{white-space:nowrap}
  #rsPop .rsp-base{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;color:var(--muted)}
  #rsForm{border-color:var(--accent)}
  #rsForm input{font:inherit;border:1px solid #c3c9d2;border-radius:4px;padding:1px 5px}
  #rsForm input.rs-date{width:92px}
  #rsForm input.rs-reason{width:260px}
  #rsForm .rs-btns{display:flex;gap:8px;margin-top:6px}
  #rsForm .rs-ok{font:inherit;background:var(--accent);color:#fff;border:none;border-radius:5px;padding:3px 12px;cursor:pointer}
  #rsForm .rs-cancel{font:inherit;background:#fff;border:1px solid var(--btn-border);border-radius:5px;padding:3px 10px;cursor:pointer}
  .grow.done .bar.actual{background:#8c98a6}  /* 完了=グレーのバー（青=進行中／グレー=完了 を一目で。状態の区別・色覚に依らない輝度差） */
  .grow.done .bar.over{background:#b07480} .grow.done .delay{color:#b07480}  /* 完了済みの終了遅延=くすんだ赤（確定・過去）。進行中の鮮赤=まだ増える緊急、と区別 */
  /* 親(集約)=細いサマリーバー（予定枠も実績も遅延も薄く）＝形で葉と区別・色は増やさない・CUD安全・全情報も保持 */
  .grow.parent .bar.plan{top:9px;height:12px;border-width:1.5px} .grow.parent .bar.actual,.grow.parent .bar.over{top:11px;height:8px}  /* 細いサマリーだが実績の充填比率は子と同じ（枠12に対し上下2px余白＝子の20:14と同比率）。中心15 */
  .pspan{position:absolute;top:12px;height:6px;border-radius:3px;background:var(--pspan)}
  #overlay{position:absolute;top:0;left:0;z-index:2;pointer-events:none}
  #empty{padding:40px;color:var(--muted);text-align:center;width:100%}
  #notice{display:none;padding:6px 12px;background:#fff7d6;border-bottom:1px solid #e3d9a8;color:#6b5d1f;font-size:12px}
  #notice.show{display:block}
  /* ===== ここから統合（課題）用の追記。新規セレクタのみ・wbs の既存規則には触れない ===== */
  /* 計画｜課題 の2択スイッチ（右ペインの時間/進捗タブと同じ作法）。課題が無いファイルでは hidden＝0px */
  #pmSwitch{display:inline-flex;align-self:center;height:40px;border:1px solid var(--btn-border);
            border-radius:6px;overflow:hidden}  /* 高さ・枠・角は #openBtn/#refreshBtn/#editBtn と同じ */
  #pmSwitch[hidden]{display:none}
  #pmSwitch .pm-b{font:inherit;height:100%;padding:0 10px;border:none;border-left:1px solid var(--btn-border);
                  border-radius:0;background:#fff;color:var(--text);cursor:pointer}
  #pmSwitch .pm-b:first-child{border-left:none}
  #pmSwitch .pm-b.on{background:var(--accent);color:#fff}  /* 選択中＝#openBtn.primary と同じ塗り */
  #pmSwitch .pm-b[disabled]{opacity:.45;cursor:default}    /* 中身が無い側は薄く（押しても切り替わらない） */
  /* 計画側の逆引き札：課題の links[].wbs から作る。links が無いファイルでは1つも DOM を作らない */
  .pmb-w{margin-left:.4em}                                 /* 作業項目名と札の間を空ける（「結合A課題 #1」と詰まるのを防ぐ・空白文字ではなくCSSで） */
  .pmb{margin-left:6px;font-size:10px;color:#8b94a3;cursor:pointer;white-space:nowrap}
  .pmb:hover{color:#2563eb;text-decoration:underline}
  .grow.pmjump,.lrow.pmjump{box-shadow:inset 0 0 0 999px rgba(255,213,79,.45)}  /* リンクで飛んだ先を2秒強調 */
  /* 課題ビューでは wbs の右上集計（期間・工数・進捗・遅延）を隠す。右上は課題の件数と更新期間だけにする。
     計画ビューでは body に class が付かない＝wbs の見た目は 1px も動かない（golden/pixel 不変） */
  /* 課題ビューでは wbs の集計を消す。visibility:hidden では多段の高さが残り操作バーが伸びるので display:none。
     右寄せは #stat の margin-left:auto を失うぶん、区切りと言語ボタンを右へ送って補う */
  body.pm-issue #stat{display:none}
  /* 計画側の絞り込みバーは課題ビューでは出さない。wbs の render()（updateSummaryAndScroll）が
     毎回 style.display="flex" を直に書くので、CSS 側で !important にしないと編集ON→render で復活する */
  body.pm-issue #filterBar{display:none!important}
  #legendBtn{display:none}                       /* 凡例は課題ビューだけ（計画ビューは 0 画素＝pixel 不変） */
  body.pm-issue #legendBtn{display:inline-block;font:inherit;font-size:11px;padding:5px 10px;
    border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;
    cursor:pointer;align-self:center}
  body.pm-issue #legendBtn:hover{border-color:var(--btn-border);background:#fff}
  body.pm-issue #topbar .tdiv:last-of-type{margin-left:auto}
  /* ===== [統合] 課題描画器の CSS（#isMain の中だけ・変数は --is-*） ===== */
  /* 配色は姉妹品(single-file-wbs)と揃える。状態/優先度は色だけに頼らずラベル併記＝CUD配慮 */
  :root{
    --is-border:#d7dbe0; --is-btn-border:#9aa2ad; --is-line:#dfe3e8; --is-head-bg:#eef0f3;
    --is-text:#1f2430; --is-muted:#6b7280; --is-accent:#2563eb; --is-edit-on:#16a34a;
    --is-done-bg:#eceff2; --is-done-fg:#6b7280; --is-red:#c0392b; --is-amber:#8a6d1f;
    --is-star:#1f2430;  /* ★＝更新の印。詳細の中は「役割ごとに表現を1種類」＝★は黒の記号だけ（塗り/枠は使わない） */
  }
  #isMain *{box-sizing:border-box}
  /* クリックで簡素表示トグル（姉妹品と同じ動機＝現場で"自作"と言える逃げ道） */
  /* 件数サマリ＝フィルタで不変（誠実なview）。メタ行はファイル名・本日・保存状態 */
  #isMain #isStat{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;color:var(--is-muted);line-height:1.25}
  #isMain #isCounts{font-size:12px;color:var(--is-text);white-space:nowrap}
  #isMain #isCounts .cnt{margin-left:10px}
  #isMain #isCounts .cnt:first-child{margin-left:0}
  #isMain #isCounts .ck{color:var(--is-muted)}
  #isMain #isCounts b{font-variant-numeric:tabular-nums}
  #isMain #isCounts .sg{color:var(--is-star)}
  /* 件数ラベルの★も同じ変数で黒に揃える */
  #isMain #isCounts .cbadge{margin-left:10px;padding:1px 7px;border-radius:8px;background:#fdecea;color:#c01a2b;font-weight:600}
  #isMain #isStat .is-mstat{font-size:11px;color:var(--is-muted);margin-top:1px;white-space:nowrap}
  #isMain #isStat .is-mstat span{cursor:help}
  #isMain #isStat .srng{display:inline-flex;align-items:center;gap:2px;vertical-align:-3px}
  /* 編集モード：更新期間を直せる */
  #isMain #isStat .srng .is-date-wrap{width:86px}
  #isMain #isStat .srng input[type="text"]{font:inherit;font-size:11px;border:1px solid #c3c9d2;border-radius:4px;padding:0 3px;width:100%;min-width:0;color:var(--is-text)}
  #isMain #isStat .srng .is-cal-btn{padding:1px 2px}
  #isMain .is-ic{width:13px;height:13px;flex:0 0 auto;vertical-align:-2px}
  /* 案件のタブバー（Excel の 1ブック＝複数案件）。開いている案件だけを描く */
  #isMain #isTabBar{display:none;flex:0 0 auto;align-items:flex-end;gap:3px;padding:5px 12px 0;background:#fff;
          overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--is-line);min-height:30px}
  #isMain .stab{flex:0 0 auto;padding:3px 12px 4px;font-size:12px;color:#8b94a3;background:#eceef2;
        border:1px solid #d4dae3;border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;line-height:1.4}
  #isMain .stab.on{background:#fdf2cc;color:var(--is-text);font-weight:600;border-color:#ead9a0;box-shadow:inset 0 2px 0 #e0a82e}
  #isMain .stab .tb{margin-left:6px;font-size:10px;font-weight:600}
  #isMain .stab .tb.st{color:var(--is-star)}
  #isMain .stab .tb.ov{color:#c01a2b}
  #isMain .stab .tb.un{color:#8a6d1f}
  /* ★は黒・⚠は赤・未決は橙（意味色） */
  #isMain .stab .tx{margin-left:7px;color:var(--is-muted);font-weight:400}
  #isMain .stab .tx:hover{color:var(--is-red)}
  #isMain #isTabBar .addproj{flex:0 0 auto;margin-left:6px;align-self:center}
  #isMain #isTbl tr.sumrow{cursor:pointer}
  #isMain #isTbl tr.sumrow:hover{background:#eef4ff}
  #isMain #isTbl tr.sumtot{font-weight:700;background:var(--is-head-bg)}
  #isMain #isTbl td.sumn,#isMain #isTbl th.sumn{text-align:right;font-variant-numeric:tabular-nums}
  /* フィルタバー：表示専用の絞り込み（データは変えない） */
  #isMain #isFilterBar{display:none;flex:0 0 auto;align-items:center;gap:10px;padding:5px 12px;border-bottom:1px solid var(--is-line);background:#f4f6f9;flex-wrap:wrap}
  #isMain #isFilterBar .is-fbar-ttl{font-size:11px;font-weight:600;color:var(--is-muted)}
  #isMain #isFilterBar #isStateFilter{flex:1 1 auto}
  /* ＋課題 を右端へ送るため幅を取る */
  #isMain .is-sfilter .addissue{margin-left:auto}

  #isMain .is-sfilter .is-sf-lbl{font-size:11px;color:var(--is-muted)}
  #isMain .is-sf-btn{font:inherit;font-size:11px;padding:2px 8px;border:1px solid var(--is-btn-border);background:#fff;border-radius:11px;cursor:pointer;color:var(--is-muted)}
  #isMain .is-sf-btn.on{background:#eef4ff;border-color:var(--is-accent);color:var(--is-accent)}
  #isMain .is-sf-btn:not(.on){text-decoration:line-through;opacity:.6}
  /* 非表示＝取り消し線で色以外でも分かる */
  #isMain .is-sfilter .is-sf-sep{width:1px;align-self:stretch;background:var(--is-border);margin:2px 2px}
  #isMain .is-sf-btn.is-sf-solo:not(.on){text-decoration:none;opacity:1}
  /* 単独トグル(期限超過)は"非表示状態"ではない */
  #isMain .is-sf-btn.is-sf-solo.on{background:#fdecef;border-color:#d94f72;color:#b23a5b}
  #isMain .is-asg-dd{position:relative;display:inline-block}

  #isMain .is-asg-dd>summary::-webkit-details-marker{display:none}
  #isMain .is-asg-dd[open]>summary{background:#eef4ff;border-color:var(--is-accent);color:var(--is-accent)}
  #isMain .is-asg-dd .is-asg-cnt{font-weight:600}
  #isMain .is-asg-list{position:absolute;top:100%;left:0;z-index:20;margin-top:3px;background:#fff;border:1px solid var(--is-btn-border);border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:6px;min-width:120px;max-height:240px;overflow:auto}
  #isMain .is-asg-list label{display:flex;align-items:center;gap:5px;font-size:12px;padding:2px 4px;white-space:nowrap;cursor:pointer}
  #isMain .is-asg-list .is-asg-acts{display:flex;gap:6px;border-bottom:1px solid var(--is-line);padding-bottom:4px;margin-bottom:4px}
  #isMain .is-asg-list .is-asg-acts button{font:inherit;font-size:10px;padding:1px 6px;border:1px solid var(--is-btn-border);border-radius:4px;background:#fff;cursor:pointer;color:var(--is-muted)}

  #isMain #isTbl th{background:var(--is-head-bg);border:1px solid var(--is-border);padding:5px 6px;font-weight:600;

  #isMain #isTbl th.title,#isMain #isTbl th.detail{text-align:left}

  /* 期限超過＝本日>期限かつ未完了 */
  #isMain .caret{display:inline-block;width:14px;color:#3b4654;user-select:none;text-align:center}
  #isMain .clk{cursor:pointer}

  /* 優先度・状態のバッジ（色＋ラベルで冗長化＝CUD） */
  #isMain .bdg{display:inline-block;padding:1px 7px;border-radius:9px;border:1px solid var(--is-btn-border);background:#fff;white-space:nowrap}
  #isMain .bdg.p-high{background:#fdecea;border-color:#d5563f;color:#a3301c;font-weight:700}

  #isMain .sub{display:block;margin-top:2px;font-size:10px;color:var(--is-muted)}
  /* 印＝状態バッジの下に小さく。待ち／凍結／未決は控えめ、催促は期限超過と同じ赤系 */
  #isMain .mks{margin-top:3px;display:flex;flex-direction:column;gap:1px;align-items:center}
  #isMain .mk{font-size:10px;line-height:1.35;color:var(--is-muted);white-space:nowrap}

  /* タイトル横の「未決 N」 */

  #isMain .ln.odec .dcmeta{color:var(--is-muted);margin:0 4px}
  #isMain /* 編集モード＝行動の編集行（.aedit）と同じ1行 flex。狭ければ折り返し、2行目は本文の左端に揃う。
     #isTbl input{width:100%}
  #isMain のID詳細度に勝つため #isTbl を付ける（!important 回避） */

  .is-cal-btn{flex:0 0 auto;font-size:11px;line-height:1.2;padding:2px 3px;border:1px solid var(--is-btn-border);background:#fff;border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#445}
  #isMain .ebtn{font:inherit;font-size:11px;padding:2px 6px;border:1px solid var(--is-btn-border);background:#fff;border-radius:4px;cursor:pointer;color:#445;display:inline-flex;align-items:center;gap:3px}

  #isMain .aedit{display:flex;gap:3px;padding-left:12px;margin-top:2px;align-items:center}
  #isMain /* #isTbl input{width:100%}

  .aedit .adate{flex:0 0 auto;width:100px}
  #isMain #isTbl .aedit .atext{flex:1 1 auto;width:auto;min-width:80px}
  #isMain #isTbl .aedit .aasg{flex:0 0 auto;width:84px}
  #isMain .aedit .ebtn,#isMain .aedit .is-donechk{flex:0 0 auto}
  #isMain .is-donechk{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:0 0 auto;
           padding:0;border:1px solid var(--is-btn-border);border-radius:3px;background:#fff;cursor:pointer;font-size:11px;line-height:1;color:var(--is-done-fg)}
  #isMain .is-donechk.on{border-color:var(--is-done-fg)}
  #isMain .is-donechk:hover{border-color:var(--is-accent)}
  #isMain .fld{margin:2px 0 2px 12px}
  #isMain .fld .lb{color:var(--is-muted)}
  /* 備考の印＝帯と同じ形・帯より薄い塗り（本文は出さず、クリックで吹き出し） */

  #isForm,#notePop,#isMain #legendPop{position:fixed;z-index:60;background:#fff;border:1px solid var(--is-accent);border-radius:8px;

<body>
  <div id="topbar">
    <span class="title" id="brandTitle"><svg class="logo" width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="9.6" fill="#1e2f63"/><rect x="4.2" y="4.8" width="7.5" height="2.7" rx="1" fill="#7da4f7"/><rect x="6" y="8.6" width="9.3" height="2.7" rx="1" fill="#cdd9f5"/><rect x="4.8" y="12.4" width="5.8" height="2.7" rx="1" fill="#7da4f7"/><polyline points="12.8,3.2 9.8,9.6 13.8,11.2 10.8,16.8" stroke="#e11d48" stroke-width="1.8" fill="none"/></svg><span style="display:flex;flex-direction:column"><span class="brand">WBS<span class="brand-x"> Viewer</span></span><span class="ver">v2.0.0</span></span></span>
    <span class="tdiv"></span>

    <button id="refreshBtn">更新</button>

    <span id="pmSwitch" hidden></span>

    <div id="empty">「ファイルを開く」または D&amp;D で <b>wbs.json</b> を読み込んでください（Chrome）。</div>
    <div id="left" style="display:none"><div class="htab-sp"></div><div id="leftHead" class="head"></div><div id="leftRows"></div></div>

<script>
"use strict";
(function(){
  // ===== [統合] 橋：課題描画器（別IIFE）との唯一の接点。課題側が無くても wbs は素のまま動く =====
  //  emit(kind,...)  : "data" / "lang" / "edit" を課題側へ通知（購読が無ければ何もしない）
  //  badge(key,id)   : 計画側の作業項目セルに出す逆引き札のHTML（課題側が無い/links が無ければ ""）
  //  expandTo(key)   : 折りたたみキー "T|案件|id" の祖先チェーンを開く（畳んだ親の中の葉を出すため）
  //  scrollToTask()  : 該当行へスクロールして2秒強調
  //  以下は課題側から使う共有の窓口：queueSave / notice / today / state
  function expandTo(pname,tid){                                              // 祖先を辿って collapsed から外す
    const proj=(normalizeProjects(lastData)||[]).find(p=>p&&p.name===pname);
    if(!proj)return false;
    let hit=false, chain=[];
    (function walk(ns,anc){
      if(!Array.isArray(ns))return;
      for(const n of ns){
        if(!n||typeof n!=="object")continue;
        if(String(n.id)===String(tid)){hit=true;chain=anc.slice();return;}
        walk(n.children,anc.concat([n]));
        if(hit)return;
      }
    })(proj.tasks,[]);
    if(!hit)return false;
    collapsed.delete("P|"+pname);
    chain.forEach(n=>collapsed.delete("T|"+pname+"|"+n.id));
    return true;
  }
  function scrollToTask(pname,tid){                                          // 行を見つけてスクロール＋2秒強調
    const rows=[...document.querySelectorAll("#leftRows .lrow")];
    const idx=rows.findIndex(r=>{const c=r.querySelector(".c.num");return c&&c.innerText.trim()===String(tid);});
    if(idx<0)return false;
    const lr=rows[idx], gr=document.querySelectorAll("#grows .grow")[idx];
    lr.scrollIntoView({block:"center"});
    [lr,gr].forEach(el=>{if(!el)return;el.classList.add("pmjump");setTimeout(()=>el.classList.remove("pmjump"),2000);});
    return true;
  }
  const PM={
    subs:{},
    on(kind,fn){(this.subs[kind]=this.subs[kind]||[]).push(fn);},
    emit(kind,...a){(this.subs[kind]||[]).forEach(f=>{try{f(...a);}catch(e){setTimeout(()=>{throw e;},0);}});},
    badgeFn:null,
    badge(key,id){try{return this.badgeFn?this.badgeFn(key,id):"";}catch(_){return "";}},
    setBadge(fn){this.badgeFn=fn;},
    queueSave:()=>queueSave(),
    notice:m=>notice(m),
    today:()=>todayStr(),
    lang:()=>lang,
    isEdit:()=>editMode,
    data:()=>lastData,
    render:()=>{if(lastData)render(lastData);},
    gotoWbs(pname,tid){                                                      // 課題→計画：表示を切替→展開→スクロール
      if(!lastData)return false;
      expandTo(pname,tid);
      PM.emit("view","plan");
      render(lastData);

  // 列メタデータ（表示=view・編集=field/edit/get を1エントリに集約）。view(c,n,x) x={leaf,inProg}・get(c,n)。

    {key:"asg",min:54,label:"colAsg",w:64,cls:"",

  // 列幅の上書き（key→px）。既定＝COLS の w・下限＝COLS の min（別テーブルを作らずメタデータに統合）

  // アウトライン式の列折りたたみ：列→折りたたみ単位の対応（No.・作業項目は対応なし＝常時表示）。数量+時間は工数の内訳でまとめる／工数は個別
  const COL_CG={qty:"qh",hrs:"qh",work:"work",prog:"prog",stat:"stat",asg:"asg",ps:"plan",pe:"plan",as:"act",ae:"act",note:"note"};
  let colCollapsed=new Set();

  function saveColCollapsed(){lsSet("wbsColCollapsed",JSON.stringify([...colCollapsed]));}
  function effCols(){return COLS.filter(c=>{const g=COL_CG[c.key];return !(g&&colCollapsed.has(g));});}  // 畳んだ列は完全に消す（隙間を作らない）。+/−はタブ帯の上に絶対配置

  // 画面に収まらない保存値は既定に戻す（大きいモニタで保存した幅を小さい画面で開くと掴み代が画面外＝手動で戻せなくなるため）

  const LEGACY_TOP=["project","milestones","tasks"];

  const quantProg=v=>{const n=Number(v);return Number.isFinite(n)?clamp(Math.round(n/10)*10,0,100):null;};
  function bizDays(from,to,hol){if(!from||!to||to<from)return 0;let n=0;const tot=diff(from,to);for(let i=0;i<=tot;i++){const ds=addStr(from,i),w=parse(ds).getUTCDay();if(w!==0&&w!==6&&!(hol&&hol.has(ds)))n++;}return n;}  // 残り営業日＝土日＋祝日(hol)を除外(#75)  // _progress→0/10/…/100に量子化。未設定はnull
  function progStep(pct,editable,path){   // 進捗の ◀ N% ▶ ステッパー。editable=編集モードのリーフ（±10%）／親は読み取り（連続値pct）

  // 状況セル（遅れ赤/実績青/予定黒）。遅れ>0なら3つ・なければ実績のみ（静か）
  function statusCell(c){

  const isOverdue=(c,today)=>!!(c.planEnd&&!c.allDone&&today>c.planEnd);   // 予定終了を過ぎても未完了＝締切超過（赤）
  function progBarRow(c,thin,done,cls){   // 進捗軸の1行：青=実績(EV)／赤=予定への不足分(slip・右端がPV)。親=細いサマリー。clsは行背景(prow/lvl0/lvl1)

  function computeNode(n,TODAY){
    const kids=kidsOf(n).filter(okNode);                                     // children が非配列/壊れ要素でも落ちない
    if(kids.length){

  function render(data){

      : period==="week" ? (()=>{const mon=addStr(TODAY,-((parse(TODAY).getUTCDay()+6)%7));return [mon,addStr(mon,6)];})()
      : (()=>{const d=parse(TODAY),first=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)).toISOString().slice(0,10),nextFirst=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)).toISOString().slice(0,10);return [first,addStr(nextFirst,-1)];})();

    function buildRows(){
      const ms=[], rows=[];
      projects.forEach((proj,pi)=>{
        arrOf(proj.tasks).forEach(n=>{if(okNode(n))computeNode(n,TODAY);});
        const lv=leavesOf(proj.tasks);
        const load=lv.reduce((s,n)=>s+n._calc.load,0);
        const prog=load?lv.reduce((s,n)=>s+n._calc.progress*n._calc.load,0)/load:0;
        const pvAgg=load?lv.reduce((s,n)=>s+(n._calc.pv||0)*n._calc.load,0)/load:0;
        const pkey="P|"+nmOf(proj.name), pcol=collapsed.has(pkey);
        const projHasVisible=lv.some(n=>leafVisible(n._calc,TODAY,n.assignee)); // フィルタ(#91/#92/#93)：配下に表示対象が1つも無ければPJごと隠す
        if(lv.length>0&&!projHasVisible)return;                                 // 表示専用＝行を間引くだけ。データ(wbs.json)は不変
        const taskRows=pcol?[]:(function build(ns,depth,prefix){const out=[];   // ボトムアップ：残る子がある親だけ残す（親残し判定）
          for(let ci=0;ci<ns.length;ci++){const n=ns[ci];const path=prefix+"/"+ci;
            if(!okNode(n))continue;                                           // 壊れた要素は描かないが ci は進める（添字＝data-path を保つ）
            const hasCh=hasKids(n), key="T|"+nmOf(proj.name)+"|"+n.id, col=hasCh&&collapsed.has(key);
            if(hasCh){const kids=col?null:build(kidsOf(n),depth+1,path);

              if(!col)out.push(...kids);
            }else{ if(!leafVisible(n._calc,TODAY,n.assignee))continue;
              out.push({kind:"task",node:n,depth,key,collapsible:false,collapsed:false,terminal:true,path});}
          }return out;})(arrOf(proj.tasks),0,String(pi));
        rows.push({kind:"proj",name:nmOf(proj.name),pi,load,prog,progress:prog,pv:pvAgg,slip:Math.max(pvAgg-prog,0),key:pkey,collapsible:true,collapsed:pcol,terminal:pcol,
          planStart:minStr(lv.map(n=>n._calc.planStart)),planEnd:maxStr(lv.map(n=>n._calc.planEnd)),
          actualStart:minStr(lv.map(n=>n._calc.actualStart)),actualEnd:maxStr(lv.map(n=>n._calc.actualEnd)),
          allDone:lv.length>0&&lv.every(n=>n._calc.allDone)});                  // イナズマ線用（折りたたみ時の集約）
        arrOf(proj.milestones).forEach(m=>{if(okNode(m))ms.push(m);});
        if(pcol)return;
        rows.push(...taskRows);
      });
      return {ms, rows};
    }

    // --- レンジ・横軸計算 ---
    // 横軸は全データ基準で固定（状態フィルタ#91で行を隠しても時間軸は動かさない＝残ったバーが動いて見えない）
    function buildRange(){
      const ds=[];
      allLeaves.forEach(n=>{const c=n._calc;[c.planStart,c.planEnd,c.actualStart,c.actualEndEff].forEach(d=>d&&ds.push(d));
        const lg=planLogOf(n);                                                // リスケ履歴(#96)：直近トレイルの起点が軸外に切れないよう範囲に含める
        if(lg.length){const f=lg[lg.length-1].from;[f.start,f.end].forEach(d=>{if(isDate(d))ds.push(d);});}});
      projects.forEach(p=>arrOf(p.milestones).forEach(m=>okNode(m)&&isDate(m.date)&&ds.push(m.date)));
      ds.push(TODAY);
      const rangeStart=minStr(ds)||TODAY, rangeEnd=maxStr(ds)||TODAY;
      const totalDays=diff(rangeStart,rangeEnd)+1, ganttW=totalDays*DAY_W;
      const xOf=d=>diff(rangeStart,d)*DAY_W, centerOf=d=>xOf(d)+DAY_W/2, barW=(s,e)=>(diff(s,e)+1)*DAY_W;
      const xToday=centerOf(TODAY);
      return {rangeStart,rangeEnd,totalDays,ganttW,xOf,centerOf,barW,xToday};
    }

    // --- 左ヘッダ構築 ---
    // 列メタ(eCols)からHTML文字列 lh を生成。グループ/caret/凡例/単位など列種別に応じて分岐
    function buildLeftHeader(){
      const rz=c=>`<span class="col-resizer" data-resize-col="${esc(c.key)}" title="${esc(t("colResize"))}"></span>`;
      let lh="";
      for(let i=0;i<eCols.length;i++){const c=eCols[i];
        if(c.group){let sub="",gc=[],j=i;
          while(j<eCols.length&&eCols[j].group===c.group){const cc=eCols[j];gc.push(cc);sub+=`<div class="hsub" data-col-key="${esc(cc.key)}" style="width:${cwv(cc)}">${esc(t(cc.label))}${rz(cc)}</div>`;j++;}
          lh+=`<div class="hg" style="width:calc(${cwAdd(gc)})"><div class="hgt">${esc(t(c.group))}</div><div class="hgb">${sub}</div></div>`;
          i=j-1;
        }else if(c.key==="name"){                                            // 作業項目ヘッダに全体caret（#52）
          const anyCol=rows.some(r=>r.collapsed);
          lh+=`<div class="h" data-col-key="${esc(c.key)}" style="width:${cwv(c)}"><span id="allCaret" class="clk caret" title="${esc(t(anyCol?"allTipExpand":"allTipCollapse"))}">${anyCol?"▶":"▼"}</span>${esc(t(c.label))}${rz(c)}</div>`;
        }else if(c.key==="stat"){                                            // 状況=2段見出し＋色分け凡例（遅赤/実青/予黒）＝そのまま凡例
          const leg=`<span class="s-d">${esc(t("statD"))}</span><span class="s-x">/</span><span class="s-a">${esc(t("statA"))}</span><span class="s-x">/</span><span class="s-p">${esc(t("statP"))}</span>`;
          lh+=`<div class="h h2l" data-col-key="${esc(c.key)}" style="width:${cwv(c)}" title="${esc(t(c.tip))}">${esc(t(c.label))}<span class="unit">${leg}</span>${rz(c)}</div>`;
        }else if(c.sub){                                                       // 単位付き見出し：短い単位は同一行・長い単位は2行（いずれも小さく薄く）。tipは計算式等のhover表示
          const tip=c.tip?` title="${esc(t(c.tip))}"`:"";
          lh+=c.inline
            ?`<div class="h" data-col-key="${esc(c.key)}" style="width:${cwv(c)}"${tip}><span>${esc(t(c.label))}<span class="unit">${esc(t(c.sub))}</span></span>${rz(c)}</div>`
            :`<div class="h h2l" data-col-key="${esc(c.key)}" style="width:${cwv(c)}"${tip}>${esc(t(c.label))}<span class="unit">${esc(t(c.sub))}</span>${rz(c)}</div>`;
        }else lh+=`<div class="h" data-col-key="${esc(c.key)}" style="width:${cwv(c)}">${esc(t(c.label))}${rz(c)}</div>`;
      }
      return lh;
    }

    // --- 日付ヘッダ構築 ---
    // 年月セグメント(ym)・日付セル(dc)・月区切り線(bg)・土日/祝日のx座標(weX)・祝日マップ(holMap)
    function buildDateHeader(){
      // 祝日（top-level の holidays）。文字列"YYYY-MM-DD" or {date,name} を許容。日付ヘッダ=赤字／列=ピンク（土日と同じ.we）
      const holMap=new Map();((data&&Array.isArray(data.holidays))?data.holidays:[]).forEach(h=>{const hd=typeof h==="string"?h:(h&&h.date);if(isDate(hd))holMap.set(hd,(h&&h.name)||"");});
      let ym="",dc="",bg="",weX=[],i=0;
      while(i<totalDays){const key=addStr(rangeStart,i).slice(0,7);let j=i;
        while(j<totalDays&&addStr(rangeStart,j).slice(0,7)===key)j++;
        ym+=`<div class="seg" style="width:${(j-i)*DAY_W}px">${t("ym")(key.slice(0,4),parseInt(key.slice(5,7),10))}</div>`;i=j;}
      for(let k=0;k<totalDays;k++){const dsx=addStr(rangeStart,k),dow=parse(dsx).getUTCDay(),hn=holMap.get(dsx);
        const cls=(dow===0?"sun":dow===6?"sat":"")+(hn!==undefined?" hol":"");
        dc+=`<div class="d ${cls}"${hn?` title="${esc(hn)}"`:""}><div>${parse(dsx).getUTCDate()}</div><div class="dow">${t("wd")[dow]}</div></div>`;
        if(dow===0||dow===6||holMap.has(dsx))weX.push(k*DAY_W);   // 土日/祝日の列x。行背景に隠れるので #ganttBg ではなくオーバーレイ(行の上)で全高に塗る
        if(dsx.slice(8,10)==="01"&&k>0)bg+=`<div class="mline" style="left:${k*DAY_W}px"></div>`;}
      return {holMap, ym, dc, bg, weX};
    }

    // --- 行本体構築 ---
    // 左表(lrows)・ガント行(grows)・進捗行(progRows)・イナズマ点(pts) を一括生成
    // sym はクロージャ内で定義（caret HTML の単一ソース）
    function buildRowBodies(){
      const sym=(r,tg)=>r.collapsible                                          // tg=true: caret自体をクリック可能に
        ?`<span class="${tg?"clk ":""}caret"${tg?` data-collapse="${esc(r.key)}"`:""}>${r.collapsed?"▶":"▼"}</span>`
        :`<span class="caret-sp"></span>`;
      let lrows="",grows="",progRows="",pts=[[xToday,0]],yTop=0;
      rows.forEach((r,idx)=>{
        let extra=0;   // 編集モードでこの行の下に挿入されるMS編集行の高さ（オーバーレイ高さ/イナズマyに織り込む）
        if(r.kind==="proj"){
          let info="";
          eCols.forEach(col=>{let v="";
            if(col.key==="no")v="◆";
            else if(col.key==="name"){
              if(editMode)v=`<span class="nm-wrap">${sym(r,true)}`
                +`<input class="nm-in" data-pname="${r.pi}" type="text" value="${esc(r.name)}" title="${esc(r.name)}">`
                +`<span class="acts"><button data-act="addtask" data-proj="${r.pi}" title="${esc(t("addTaskTip"))}">${esc(t("addTask"))}</button>`
                +`<button data-act="addms" data-proj="${r.pi}" title="${esc(t("addMsTip"))}">${esc(t("addMs"))}</button></span></span>`;
              else v=`<span class="clk" data-collapse="${esc(r.key)}">${sym(r)}<b>${esc(r.name)}</b></span>`;
            }
            else if(col.key==="work")v=esc(fmtLoad(r.load));
            else if(col.key==="prog")v=progStep(r.prog,false,"");                // プロジェクト行=集計進捗（読み取り・連続値）
            else if(col.key==="stat")v=statusCell(r);
            else if(col.key==="ps")v=esc(mdSlash(r.planStart));
            else if(col.key==="pe")v=esc(mdSlash(r.planEnd));
            const xc=(col.key==="pe"&&isOverdue(r,TODAY))?" overdue":"";        // 予定終了:本日超過かつ未完了=赤
            info+=`<div class="c ${col.cls}${xc}"${cwSty[col.key]}>${v}</div>`;});
          lrows+=`<div class="lrow prow">${info}</div>`;
          const span=r.planStart&&r.planEnd?`<div class="pspan" style="left:${xOf(r.planStart)}px;width:${barW(r.planStart,r.planEnd)}px"></div>`:"";
          grows+=`<div class="grow prow">${span}</div>`;
          progRows+=progBarRow(r,true,r.allDone,"prow");
          if(editMode&&!r.collapsed){                                          // 編集モード:プロジェクト直下にMS編集行（GUIでMS追加/編集/削除）
            const msArr=arrOf((curProjects[r.pi]||{}).milestones); extra=msArr.filter(okNode).length*ROW_H;
            msArr.forEach((m,mi)=>{if(!okNode(m))return;const MP=r.pi+"/"+mi;   // 壊れた要素は描かないが mi は元配列の添字のまま
              const cur=(isColor(m.color)?String(m.color):"#cc79a7").toLowerCase();
              const inSet=MS_COLORS.includes(cur);
              let sw=inSet?"":`<button class="ms-sw on" data-act="setmscolor" data-mpath="${MP}" data-color="${cur}" style="background:${cur}" title="${cur}"></button>`;  // 現在色がプリセット外でも先頭に「選択中」で表示
              sw+=MS_COLORS.map(c=>`<button class="ms-sw${cur===c?" on":""}" data-act="setmscolor" data-mpath="${MP}" data-color="${c}" style="background:${c}" title="${c}"></button>`).join("");
              lrows+=`<div class="lrow msrow"><span class="ms-edit"><span class="ms-tag">${esc(t("milestone"))}</span>`
                +`<span class="date-wrap"><input data-mpath="${MP}" data-mfield="date" type="text" placeholder="MM-DD" value="${esc(m.date||"")}"><input type="date" class="cal-proxy" tabindex="-1" aria-hidden="true"><button type="button" class="cal-btn" data-cal title="${esc(t("calTip"))}">${ICN.cal}</button></span>`
                +`<input class="ms-label" data-mpath="${MP}" data-mfield="label" type="text" placeholder="${esc(t("msLabelPh"))}" value="${esc(m.label||"")}">`
                +`<span class="ms-sws">${sw}</span>`
                +`<button data-act="delms" data-mpath="${MP}" title="${esc(t("del"))}">${ICN.del}</button></span></div>`;
              grows+=`<div class="grow msrow"></div>`; progRows+=`<div class="prw msrow"></div>`;});
          }
        }else{
          const n=r.node,c=n._calc,leaf=n._leaf;
          const inProg=leaf&&c.actualStart&&!c.actualEnd, done=c.allDone;  // 完了=実績終了あり（集計は全子完了）
          const P=esc(r.path);
          const rlog=leaf?planLogOf(n):[];                                    // リスケ履歴(#96・リーフのみ)
          const x={leaf,inProg,path:P};
          const inp=(f,val,type)=>type==="date"                                // 編集入力欄（型でテンプレ分岐）
            ?`<span class="date-wrap"><input data-path="${P}" data-field="${f}" type="text" placeholder="MM-DD" value="${esc(val)}">`
              +`<input type="date" class="cal-proxy" tabindex="-1" aria-hidden="true">`
              +`<button type="button" class="cal-btn" data-cal title="${esc(t("calTip"))}">${ICN.cal}</button></span>`
            :`<input data-path="${P}" data-field="${f}" type="${type}"${type==="number"?' step="any"':""} value="${esc(val)}">`;
          let info="";
          eCols.forEach(col=>{let v="";
            if(col.key==="no")v=editMode?inp("id",n.id,"text"):esc(n.id);
            else if(col.key==="name"){
              const bdg=rlog.length?`<button class="rsbdg" data-rslog="${P}" title="${esc(t("rsTip"))}">↷${rlog.length}</button>`:"";  // ↷N=修正回数（クリックで履歴の吹き出し・#96）
              if(editMode){
                const move=`<span class="movegrp"><button data-act="up" data-path="${P}" title="${esc(t("up"))}">${ICN.up}</button>`  // ⬆⬇=兄弟内移動（caretの三角と区別）・チェックの前
                  +`<button data-act="down" data-path="${P}" title="${esc(t("down"))}">${ICN.down}</button></span>`;
                const acts=`<span class="acts">`
                  +(leaf?`<button data-act="resched" data-path="${P}" title="${esc(t("rsBtnTip"))}">↷</button>`:"")  // リスケ(#96)：履歴に記録して予定を更新（日付セル直接編集=訂正と分離）
                  +`<button data-act="add" data-path="${P}" title="${esc(t("addBelow"))}">${ICN.add}</button>`
                  +(r.depth<2?`<button data-act="addchild" data-path="${P}" title="${esc(t("addChild"))}">${ICN.leaf}</button>`:"")  // ＋子=入れ子追加（葉アイコン・#49/#70）。3L(深さ2)は4L禁止のため出さない
                  +`<button data-act="del" data-path="${P}" title="${esc(t("del"))}">${ICN.del}</button></span>`;
                const doneCtl=leaf                                              // リーフ=押せる完了チェック／集計ノード=読み取り✓のまま
                  ?`<button class="donechk${done?" on":""}" data-act="done" data-path="${P}" title="${esc(t("doneTip"))}">${done?"✓":""}</button>`
                  :(done?'<span class="done-mark">✓</span>':"");
                v=`<span class="nm-wrap" style="padding-left:${r.depth*15}px">${sym(r,true)}${move}${doneCtl}`
                  +`<input class="nm-in" data-path="${P}" data-field="name" type="text" value="${esc(nmOf(n.name))}" title="${esc(nmOf(n.name))}">${bdg}${acts}</span>`;
              }else{
                const body=`${sym(r)}${done?"✓ ":""}<span class="nm">${esc(nmOf(n.name))}</span>`;
                const pmb=PM.badge(r.key,n.id);                              // [統合] 逆引き札（links が無ければ ""）
                v=r.collapsible
                  ?`<span style="padding-left:${r.depth*15}px"><span class="clk" data-collapse="${esc(r.key)}">${body}</span>${bdg}${pmb}</span>`
                  :`<span style="padding-left:${r.depth*15}px">${body}${bdg}${pmb}</span>`;
              }
            }
            else{                                                              // メタデータ駆動：表示=view・編集=field/get（リーフのみ）
              v=col.view?col.view(c,n,x):"";
              if(editMode&&leaf&&col.field)v=inp(col.field,col.get(c,n),col.edit);
            }
            let tip="";
            if(col.key==="name"&&!editMode)tip=` title="${esc(nmOf(n.name))}"`;
            else if(col.key==="note"&&leaf&&n.note&&!editMode)tip=` title="${esc(n.note)}"`;
            const xc=(col.key==="pe"&&isOverdue(c,TODAY))?" overdue":"";        // 予定終了:本日超過かつ未完了=赤
            info+=`<div class="c ${col.cls}${xc}"${cwSty[col.key]}${tip}>${v}</div>`;});
          const lvl=`lvl${Math.min(r.depth,2)}`;
          lrows+=`<div class="lrow ${leaf?"leaf":"parent"} ${lvl} ${done?"done":""}">${info}</div>`;
          let bars="";
          const ps=c.planStart,pe=c.planEnd,as=c.actualStart,ae=c.actualEnd,aeEff=c.actualEndEff;
          const md=(a,b)=>`${mdSlash(a)}〜${b?mdSlash(b):t("active")}`;
          const endDelay=(pe&&aeEff&&aeEff>pe)?diff(pe,aeEff):0;             // 終了遅延日数（進行中は本日までで計算）
          const startDelay=(ps&&as&&as>ps)?diff(ps,as):0;                    // 着手遅れ日数
          let bt=[ps&&pe?`${t("grpPlan")} ${md(ps,pe)}`:"", as?`${t("grpActual")} ${md(as,ae)}`:"",
                  startDelay?t("startDelayTip")(startDelay):"", endDelay?t("endDelayTip")(endDelay,!ae):""].filter(Boolean).join("&#10;");
          if(bt)bt=` title="${bt}"`;
          if(ps&&pe)bars+=`<div class="bar plan"${bt}${rlog.length?` data-rslog="${P}"`:""} style="left:${xOf(ps)}px;width:${barW(ps,pe)}px"></div>`;   // 予定=塗りなしの枠（前面）。リスケ済みはクリックで履歴(#96)
          // 着手遅れは枠の左が空くことで表現（専用バー無し）。精密値は startDelayTip でツールチップに残す
          if(as&&aeEff){
            const pxAS=xOf(as), pxAEend=xOf(aeEff)+DAY_W, pxPEend=pe?xOf(pe)+DAY_W:pxAEend;
            const normalRight=endDelay?Math.min(pxAEend,pxPEend):pxAEend;
            if(normalRight>pxAS)bars+=`<div class="bar actual${endDelay?" cut":""}"${bt} style="left:${pxAS}px;width:${normalRight-pxAS}px"></div>`;
            if(endDelay){const ovL=Math.max(pxAS,pxPEend);
              bars+=`<div class="bar over"${bt} style="left:${ovL}px;width:${pxAEend-ovL}px"></div>`;
              // 遅延ラベルは一律「線の先」（実績終了の直後）。中央配置はイナズマの角度で隠れ得るため、被りは妥協し一貫性を優先
              bars+=`<div class="delay" style="left:${pxAEend+3}px">+${endDelay}</div>`;}
          }
          if(rlog.length&&ps&&pe){                                            // リスケ履歴(#96)：直近の修正1本だけトレイル（下=開始/上=終了。過去分は吹き出し＝ごちゃつき上限固定）
            const lt=rlog[rlog.length-1];
            const tr=(od,x1,top)=>{ if(!isDate(od))return;
              const x0=centerOf(od); if(Math.abs(x1-x0)<3)return;
              bars+=`<span class="rs-knob${top?" top":""}" style="left:${x0-2}px"></span>`
                  +`<span class="rs-seg${top?" top":""}" style="left:${Math.min(x0,x1)}px;width:${Math.max(Math.abs(x1-x0),6)}px"></span>`
                  +`<span class="rs-arr${top?" top":""}" style="left:${x1-5}px">›</span>`;};
            if(lt.from.start!==ps)tr(lt.from.start,xOf(ps),false);
            if(lt.from.end!==pe)tr(lt.from.end,xOf(pe)+DAY_W,true);
          }
          grows+=`<div class="grow ${leaf?"leaf":"parent"} ${lvl} ${done?"done":""}">${bars}</div>`;
          progRows+=progBarRow(c,!leaf,done,lvl);
        }
        // イナズマ点：terminal行（リーフ or 折りたたみ済ノード）。
        //   完了=本日線 / 未着手で予定開始超過=予定開始日(左,着手遅延) /
        //   期限超過で未完了=予定終了日(左,終了遅延) / 進行中(期限内)=本日線
        if(r.terminal){
          const c=r.kind==="task"?r.node._calc:r;
          let px=xToday;
          if(!c.allDone){
            if(c.actualStart&&c.planEnd&&TODAY>c.planEnd)px=centerOf(c.planEnd);              // 終了遅延：期限超過で未完了
            else if(!c.actualStart&&c.planStart&&TODAY>c.planStart)px=centerOf(c.planStart);  // 着手遅延：未着手で予定開始超過
            // 進行中（期限内）は本日線（着手ズレは表示しない）
          }
          pts.push([clamp(px,0,ganttW),yTop+ROW_H/2]);
        }
        yTop+=ROW_H+extra;                                                     // この行＋（編集モードなら）MS編集行ぶんを進める
      });
      return {lrows, grows, progRows, pts, rowsH:yTop};
    }

    // --- SVGオーバーレイ構築 ---
    // 土日/祝日シェード・マイルストーン線・イナズマ線/点 を1つのSVG文字列として生成
    function buildSvgOverlay(){
      // 土日/祝日の列を行の上に薄ピンクで重ねる（#ganttBg背景は不透明な行背景に隠れるため、オーバーレイで全高に効かせる）
      // 半透明なのでバー/イナズマ/本日線は後段で上書きされ視認性を損なわない
      let svg=weX.map(x=>`<rect class="we" x="${x}" y="0" width="${DAY_W}" height="${rowsH}" fill="#d94f72" opacity="0.10"></rect>`).join("");
      // CSS変数(var(--x))はSVGのプレゼンテーション属性では解決されない → stroke/fill はリテラル色を書く
      // 線は全高で重なってOK。ラベルだけ近接時に重ならないようレーン（縦段）に割り当てる
      const mvis=ms.filter(m=>isDate(m.date)&&m.date>=rangeStart&&m.date<=rangeEnd)
        .map(m=>({m,x:centerOf(m.date)})).sort((a,b)=>a.x-b.x);
      const laneEnd=[];                                                    // 各レーンの直近ラベル右端x
      mvis.forEach(({m,x})=>{
        const col=isColor(m.color)?m.color:"#cc79a7";                     // 色は#hexのみ許可（注入防止）。既定=Okabe-Ito赤紫(青と安全に分離・#35）
        const lbl=String(m.label??""), w=Math.max(28,lbl.length*11);      // label欠損でも落とさない
        const lx=(x+2+w>ganttW)?Math.max(0,x-2-w):x+2;                    // 右端はみ出しならラベルを線の左側へ寄せる（見切れ防止・クランプ）
        let lane=0; while(lane<laneEnd.length&&laneEnd[lane]>lx-3)lane++;  // 直近ラベルが終わってる最初のレーンへ
        laneEnd[lane]=lx+w+3;

  // Why not: ドラッグ中に render() を呼ばない。幅は CSS 変数 --cw-<key> 経由なので変数1つの書き換えでヘッダ/全セルが追従する
  //（毎 mousemove の innerHTML 全再構築＝行数×列数の仕事を避ける）。px 直値で組む +/− 位置の確定だけ mouseup で1回再描画する。

    resizingCol={col:c,startX:e.clientX,startW:cwBase(c),moved:false,
                 maxW:Math.max(c.min||40,maxTotalCW()-others-(cwEff(c)-cwBase(c)))};

    if(colWidths[c.key]===w)return;

  // ===== 編集モード（インライン編集・追加/削除/上下移動・自動保存） =====
  // 設計：変異は同期で行い即 render（DOMのdata-pathを常に最新に保つ）。保存はデバウンス＋単一チェーンで直列化。
  const DATE_FIELDS={ps:["plan","start"],pe:["plan","end"],as:["actual","start"],ae:["actual","end"]};
  const newLeaf=id=>({id,name:t("newTask"),qty:1,hours:8,assignee:"",plan:{start:null,end:null},actual:{start:null,end:null},note:""});
  const mintId=(arr,prefix)=>{const ids=new Set(arr.map(x=>String(x.id)));let nn=arr.length+1;while(ids.has(prefix+nn))nn++;return prefix+nn;};
  function resolvePath(path){
    const parts=path.split("/").map(Number), proj=curProjects&&curProjects[parts[0]];
    if(!proj)return {}; let arr=arrOf(proj.tasks), node=null;
    for(let k=1;k<parts.length;k++){node=arr[parts[k]]; if(!okNode(node))return {proj}; if(k<parts.length-1)arr=kidsOf(node);}
    return {proj,parentArray:arr,index:parts[parts.length-1],node};
  }
  function applyField(n,f,val){
    if(f==="qty"||f==="hours")n[f]=val===""?0:(Number(val)||0);
    else if(DATE_FIELDS[f]){
      const[grp,key]=DATE_FIELDS[f];
      const cur=(n[grp]&&typeof n[grp]==="object")?n[grp][key]:null;          // 既存値（年補完に使う）
      const iso=expandDate(val,cur);                                          // 611/6-11/full等→full ISO・無効はnull
      if(iso===null)return;                                                   // 解釈不能・範囲外は無視（ゴミを保存しない）
      if(!n[grp]||typeof n[grp]!=="object")n[grp]={}; n[grp][key]=iso===""?null:iso;
    }else n[f]=val;   // id, name, assignee, note
  }
  async function ensureWritable(){   // file:// では権限プロンプトが出せないため段階的にフォールバック（#17/#18/#19）
    try{
      if(fileHandle.queryPermission&&await fileHandle.queryPermission({mode:"readwrite"})==="granted")return true;
    }catch(_){}
    if(!pickerNeeded){                                                       // 2回目以降は前処理を全スキップ（ジェスチャー温存）
      try{
        if(fileHandle.requestPermission){
          const r=await fileHandle.requestPermission({mode:"readwrite"});
          if(r==="granted")return true;
          if(r==="denied"){alert(t("permDenied"));return false;}
        }
      }catch(_){pickerNeeded=true;}                                          // file:// は例外 → 以後ピッカー方式
      if(!pickerNeeded){
        try{
          const w=await fileHandle.createWritable({keepExistingData:true});  // 書込ストリームを開いて確認
          await w.abort();                                                   // 中身は変更しない（swapを破棄）
          return true;
        }catch(_){pickerNeeded=true;}
      }
    }
    // 保存ピッカーで選び直してもらう（選択自体が書き込み許可になる）。
    // 注意：ジェスチャー失効を防ぐため、ここまで alert 等のダイアログは一切挟まない（#19）。案内はページ内バーで出す（#30）
    if(!window.showSaveFilePicker){alert(t("permUnavailable"));return false;}
    notice(t("pickerGuide"));
    try{
      const f=await fileHandle.getFile();
      const h=await window.showSaveFilePicker({suggestedName:f.name,
        types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
      try{
        if(fileHandle.isSameEntry&&!await h.isSameEntry(fileHandle)&&
           !confirm(t("diffFile"))){
          notice("");
          alert(t("truncWarn"));
          return false;
        }
      }catch(_){}
      fileHandle=h; fileMtime=0;                                             // 以後の保存先を書込可ハンドルに
      saveChain=saveChain.then(writeNow); await saveChain;                   // ピッカーの「置換」は選択時点でファイルを切り詰めるため、即書込して空のまま残さない（#29）
      notice("");
      return true;
    }catch(e){
      if(e&&e.name==="AbortError"){                                          // ユーザーキャンセル
        notice(t("pickerRetryCancel"));
        return false;
      }
      if(/user gesture/i.test(e&&e.message||""))                             // ジェスチャー失効 → 再クリックで最短経路
        notice(t("pickerRetryGesture"));
      else{notice("");alert(t("permErr")+e.message);}
      return false;
    }
  }
  // 保存キュー：dirty → デバウンス → 単一チェーンで書込（並走書込・古いスナップショット後勝ちを防ぐ）
  function setSaveMsg(m){saveMsg=m;const el=$("saveMsg");if(el)el.innerHTML=m?"・ "+ICN.save+" "+esc(m):"";}
  function notice(m){const el=$("notice");el.textContent=m;el.classList.toggle("show",!!m);}  // ページ内の案内バー（alertと違いジェスチャーを消費しない）
  function queueSave(){dirty=true;setSaveMsg(t("unsaved"));clearTimeout(saveTimer);saveTimer=setTimeout(flushSaves,SAVE_DEBOUNCE_MS);}
  function flushSaves(){clearTimeout(saveTimer);if(dirty){dirty=false;saveChain=saveChain.then(()=>writeNow());}return saveChain;}
  async function writeNow(retry){
    if(!fileHandle||!fileHandle.createWritable){setSaveMsg(t("saveFail"));alert(t("cantSave"));return;}
    try{
      const cur=await fileHandle.getFile();                                  // 外部変更（AI編集等）の検知
      if(fileMtime&&cur.lastModified!==fileMtime&&
         !confirm(t("extChange"))){
        savePending=true;                                                    // 書けなかった編集が lastData に残っている
        setSaveMsg(t("savePending"));return;
      }
      const json=JSON.stringify(lastData,(k,v)=>(k==="_calc"||k==="_leaf")?undefined:v,2);  // 内部派生値のみ除外
      const w=await fileHandle.createWritable(); await w.write(json); await w.close();
      fileMtime=(await fileHandle.getFile()).lastModified;
      savePending=false;
      setSaveMsg(t("savedAt")+new Date().toLocaleTimeString(t("locale")));
    }catch(e){
      // InvalidStateError＝同期/AV等の横入りでブラウザのスナップショットが陳腐化。1拍おいて1回だけ再試行（再getFileで更新）。createWritableが弾く＝書込前なので原本は無傷
      if(e&&e.name==="InvalidStateError"&&!retry){await new Promise(r=>setTimeout(r,SAVE_RETRY_DELAY_MS));return writeNow(true);}
      dirty=true;                                                            // 失敗を抱え落ちさせない（次のqueueSave／離脱警告で再保存。alertループは避けるため自動再キューはしない）
      setSaveMsg(t("saveFail"));alert(t("saveErr")+e.message);
    }
  }

      asg=`<span class="sf-sep"></span><details class="asg-dd"${wasOpen?" open":""}><summary title="${esc(t("fAsgTip"))}">${esc(t("fAsg"))} <span class="asg-cnt">${esc(badge)}</span></summary>`
        +`<div class="asg-list"><div class="asg-acts"><button type="button" class="asg-all">${esc(t("fAsgSelAll"))}</button><button type="button" class="asg-none">${esc(t("fAsgClear"))}</button></div>${opts}</div></details>`;
    }
    const per=`<span class="sf-sep"></span><span class="seg" title="${esc(t("fPerTip"))}">`+   // 期間(#94)：単一選択セグメント
      PERIODS.map(p=>`<button class="seg-btn${period===p.k?" on":""}" data-period="${esc(p.k)}">${esc(t(p.l))}</button>`).join("")+`</span>`;
    el.innerHTML=states+delay+asg+per;
  }
  const refreshFilters=()=>{ if(lastData)render(lastData); else renderStateFilter(); };  // renderがフィルタバーも再構築（開閉は保持）
  $("stateFilter").addEventListener("click",e=>{
    const sf=e.target.closest(".sf-btn");
    if(sf){
      // SF_AXES テーブルで data-属性を照合しトグルを実行（if-else 分岐の代わり）
      const ax=SF_AXES.find(a=>sf.hasAttribute(a.attr));
      if(ax)ax.toggle(sf.getAttribute(ax.attr));
      refreshFilters();
    }else if(e.target.closest(".asg-all")){asgOff.clear();saveAsg();refreshFilters();}                    // 担当:全選択
    else if(e.target.closest(".asg-none")){asgOff.clear();asgList.forEach(a=>asgOff.add(a));saveAsg();refreshFilters();}  // 担当:全解除
    else if(e.target.closest(".seg-btn")){period=e.target.closest(".seg-btn").getAttribute("data-period");lsSet("wbsPeriod",period);refreshFilters();}  // 期間(#94)
  });
  $("stateFilter").addEventListener("change",e=>{       // 担当(#93)チェックボックス＝複数選択
    const cb=e.target.closest(".asg-cb"); if(!cb)return;
    const a=cb.getAttribute("data-asg");
    cb.checked?asgOff.delete(a):asgOff.add(a);
    saveAsg(); refreshFilters();
  });
  $("langBtn").addEventListener("click",()=>{
    lang=lang==="ja"?"en":"ja";
    lsSet("wbsLang",lang);
    applyLang(); if(lastData)render(lastData);
  });
  applyLang();
  // 簡素表示トグル(#79)：ロゴ/版/“Viewer”/タブ名を隠し「WBS」だけに。現場で“自作”と言える逃げ道。クリックで切替・localStorage記憶
  function applyPlain(){const on=lsGet("wbsPlain")==="1";
    document.body.classList.toggle("plain",on); document.title=on?"WBS":"WBS Viewer";}
  $("brandTitle").addEventListener("click",()=>{
    const on=!document.body.classList.contains("plain");
    lsSet("wbsPlain",on?"1":"0");
    applyPlain();
  });
  applyPlain();

})();
</script>

  let lang="ja";if(lsGet("issLang")==="en")lang="en";  // 既定は日本語・明示切替のみ記憶
  const t=k=>I18N[lang][k];

  // ===== 事実→導出のテーブル（状態・優先度・保留理由・閉じ方は全部ここが単一ソース） =====
  // 状態は3つだけ（上から順に判定）。「保留」「未決」は状態ではなく“印”（下の MARKS）に移した
  const STATES=[
    {k:"closed",l:"sClosed",test:f=>!!f.closed},                 // 閉じた
    {k:"wip",   l:"sWip",   test:f=>f.anyDone},                  // 済んだ行動が1つ以上＝動き出している
    {k:"todo",  l:"sTodo",  test:()=>true},                      // 済んだ行動が無い
  ];
  const STATE_ORDER=["todo","wip","closed"];  // 画面（フィルタ・件数・サマリ）での並び＝進行順
  // 印＝状態と別に付く目印。未着手・対応中には同時に付き、完了には付けない（作者裁定 2026-09-09）
  const MARKS=[
    {k:"wait",  l:"mkWait",     test:f=>f.pk==="waiting"},
    {k:"frozen",l:"mkFrozen",   test:f=>f.pk==="frozen"},
    {k:"open",  l:"sUndecided", test:f=>f.nOpen>0},
    {k:"ovd",   l:"cntOverdue", test:f=>f.overdue},
    {k:"nudge", l:"mkNudge",    test:f=>f.nudge},   // 待ちの until を過ぎた＝催促どき
    {k:"star",  l:"cntStarWord",test:f=>f.star},
  ];
  const MARK_ORDER=MARKS.map(m=>m.k);
  const MK_FLBL={wait:"fWaitOnly",frozen:"fFrozenOnly",open:"fOpenOnly",ovd:"fOverdue",nudge:"fNudgeOnly",star:"fStarOnly"};
  const PRIORITIES=[{k:"high",l:"pHigh"},{k:"mid",l:"pMid"},{k:"low",l:"pLow"}];
  // 止まっている理由は2種類だけ：待ち（相手の返事待ち）と凍結（事情で止めた）
  // 待つ相手＝人名（文字列）か 課題（{issue} / {project,issue}）。壊れた値は「名前なしの人」に落とす
  function whoOf(w,SN){
    if(okObj(w)){
      const id=w.issue;
      if(id!==undefined&&id!==null&&String(id)!=="")
        return {kind:"issue",pj:str(w.project)||SN,id:String(id),name:""};
      return {kind:"person",name:""};
    }
    return {kind:"person",name:str(w)};
  }
  function pendOf(is,SN){
    const p=obj(is&&is.pending); if(!p)return null;
    const kind=str(p.kind);
    if(kind!=="waiting"&&kind!=="frozen")return null;      // 既知値以外＝印を出さない（pending は無いものとして描く）
    return {kind, since:isDate(p.since)?p.since:null, who:whoOf(p.who,SN), what:str(p.what),
            until:isDate(p.until)?p.until:null, resumeWhen:str(p.resumeWhen)};
  }
  const CLOSE_HOWS=[{k:"resolved",l:"hResolved"},{k:"wontfix",l:"hWontfix"},
                    {k:"not_occurred",l:"hNotOccurred"},{k:"duplicate",l:"hDuplicate"}];
  const PRIO_RANK={high:0,mid:1,low:2};
  const SORTS=[{k:"no",l:"sortNo"},{k:"due",l:"sortDue"},{k:"prio",l:"sortPrio"}];

  // ===== 表示状態（すべて表示専用。データ（JSON）には一切書かない） =====
  // 保存・権限・外部変更の検知は wbs 側の1本（PM.queueSave）に集約している。
  // ここに fileHandle / dirty / saveTimer を持たない＝検知が2系統に割れないようにする。
  let lastData=null, curIssues=[];
  let editMode=false, refreshTimer=null;
  let saveMsg="",curFileName="",updAt="";
  const stateOn=new Set(STATE_ORDER);  // 既定=全ON（既定の見た目＝絞らない）
  try{const s=JSON.parse(lsGet("issStateFilter")||"null");if(Array.isArray(s)){stateOn.clear();s.forEach(k=>STATE_ORDER.includes(k)&&stateOn.add(k));}}catch(_){}
  if(!stateOn.size)STATE_ORDER.forEach(k=>stateOn.add(k));  // 旧版の記憶（未決/保留）だけだと全部消えるので既定へ戻す
  const prioOn=new Set(PRIORITIES.map(p=>p.k));
  try{const s=JSON.parse(lsGet("issPrioFilter")||"null");if(Array.isArray(s)){prioOn.clear();s.forEach(k=>PRIORITIES.some(p=>p.k===k)&&prioOn.add(k));}}catch(_){}
  const asgOff=new Set();try{const a=JSON.parse(lsGet("issAsgOff")||"null");if(Array.isArray(a))a.forEach(x=>asgOff.add(x));}catch(_){}  // 非表示にした担当。既定=空=全員表示（off集合方式＝新担当は既定で見える）
  let asgList=[];
  const markOn=new Set();  // 「印だけに絞る」トグル（既定=空=絞らない）。印どうしは AND
  try{const m=JSON.parse(lsGet("issMarkOn")||"null");if(Array.isArray(m))m.forEach(k=>MARK_ORDER.includes(k)&&markOn.add(k));}catch(_){}
  let sortKey="no";{const s=lsGet("issSort");if(SORTS.some(x=>x.k===s))sortKey=s;}
  const SUMMARY="\u0001summary";  // サマリタブの内部キー（案件名と衝突しない制御文字）
  let tabSel=lsGet("issProj")||"";  // 開いているタブ＝案件名 or SUMMARY。無ければ最初の案件
  let curProjs=[],curProjIdx=-1,curProjObj=null,curBook=false;
  const collapsed=new Set();  // 折りたたみ中の課題（キー＝案件名|id・localStorage記憶）
  try{const c=JSON.parse(lsGet("issCollapsed")||"null");if(Array.isArray(c))c.forEach(x=>collapsed.add(String(x)));}catch(_){}
  const saveCollapsed=()=>lsSet("issCollapsed",JSON.stringify([...collapsed]));

  // ===== 小さな共通関数（姉妹品から流用） =====
  const parse=s=>new Date(s+"T00:00:00Z");
  const isDate=s=>typeof s==="string"&&/^(19|20)\d{2}-\d{2}-\d{2}$/.test(s)&&!isNaN(parse(s).getTime());  // 年は1900-2099（範囲外はゴミ入力扱い）
  const mdSlash=s=>s?(parse(s).getUTCMonth()+1)+"/"+parse(s).getUTCDate():"";
  const addStr=(s,d)=>new Date(parse(s).getTime()+d*DAY_MS).toISOString().slice(0,10);
  const todayStr=()=>{const n=new Date();return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())).toISOString().slice(0,10);};
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  // note内の http(s) URL のみリンク化（表示はURLのまま）。javascript:/HTML注入は構造的に不可（^https?:固定・<>はURLに含めない・テキスト片は全てesc）
  const linkify=s=>String(s??"").split(/(https?:\/\/[^\s"<>]+)/g)
    .map((part,i)=>i%2?`<a href="${esc(part)}" target="_blank" rel="noopener noreferrer">${esc(part)}</a>`:esc(part))
    .join("");
  const str=v=>typeof v==="string"?v:"";  // 文字列以外は「空」扱い（異常系：落とさない）
  const obj=v=>(v&&typeof v==="object"&&!Array.isArray(v))?v:null;  // オブジェクト以外はnull扱い
  const shortDate=iso=>(iso&&isDate(iso)&&iso.slice(0,4)===todayStr().slice(0,4))?iso.slice(5):(iso||"");  // 今年は MM-DD、他年は full ISO
  // ショートハンド入力→full ISO（611/6-11/6/11=今年のMD、270611/20270611、27-6-11 等）。無効はnull・空は""
  const expandDate=(val,curISO)=>{
    val=String(val).trim().replace(/\//g,"-");
    if(val==="")return "";
    if(isDate(val))return val;
    const defYr=(curISO&&isDate(curISO))?curISO.slice(0,4):todayStr().slice(0,4);
    const yr4=y=>y.length===2?"20"+y:y;
    let yr,m,d,parts=val.split("-"),g=val.replace(/\D/g,"");
    if(parts.length===2&&/^\d{1,2}$/.test(parts[0])&&/^\d{1,2}$/.test(parts[1])){yr=defYr;[m,d]=parts;}
    else if(parts.length===3&&/^\d{2}(\d{2})?$/.test(parts[0])&&/^\d{1,2}$/.test(parts[1])&&/^\d{1,2}$/.test(parts[2])){yr=yr4(parts[0]);[,m,d]=parts;}
    else if(g.length===3){yr=defYr;m=g.slice(0,1);d=g.slice(1);}
    else if(g.length===4){yr=defYr;m=g.slice(0,2);d=g.slice(2);}
    else if(g.length===6){yr=yr4(g.slice(0,2));m=g.slice(2,4);d=g.slice(4);}
    else if(g.length===8){yr=g.slice(0,4);m=g.slice(4,6);d=g.slice(6);}
    else return null;
    const iso=`${yr}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
    return isDate(iso)?iso:null;
  };
  const labelOf=(tbl,k)=>{const e=tbl.find(x=>x.k===k);return e?t(e.l):"";};  // テーブル駆動のラベル引き（enum不正なら空＝バッジ無し）

  // ===== 正規化と導出（§3.4）。導出値は JSON に書かず、描画のたびに事実から計算する =====
  // ★の対象期間＝「報告期間」。トップレベルの任意 star:{from,to} で指定（to 省略＝本日）。
  // star が無い／日付が不正／from>to は既定＝本日を含む直近7日。既定値は JSON に書き戻さない
  function starRange(d,TODAY){
    const s=obj(d&&d.star);
    if(s&&isDate(s.from)){
      const hasTo=s.to!==undefined&&s.to!==null&&s.to!=="";
      const to=hasTo?(isDate(s.to)?s.to:null):TODAY;
      if(to&&s.from<=to)return {from:s.from,to,custom:true};
    }
    return {from:addStr(TODAY,-6),to:TODAY,custom:false};
  }
  // ブック＝案件（projects）の束。v0.2 は projects[] が正。
  // 課題側の形は projects[].issues の1本だけ（v0.2 が最初の公開形＝旧形式の読み替えは持たない）。
  // 案件の知らないキー（tasks / milestones など）は触らず、保存でそのまま残す。
  const okObj=x=>!!x&&typeof x==="object"&&!Array.isArray(x);
  function normalizeProjects(d){
    if(!okObj(d))return [];
    if(Array.isArray(d.projects))return d.projects.filter(okObj);
    return [];
  }
  const isBookForm=d=>okObj(d)&&Array.isArray(d.projects);
  const projName=sh=>str(sh&&sh.name);
  function normalizeIssues(d){
    if(!d||typeof d!=="object"||Array.isArray(d))return [];  // トップが非オブジェクト → 空表示（落とさない）
    if(!Array.isArray(d.issues))return [];
    return d.issues.filter(x=>x&&typeof x==="object"&&!Array.isArray(x));
  }
  // 1課題ぶんの導出値。壊れた値は「無視して既定へ落とす」（graceful degradation）
  // 方針（decisions[]）＝1課題に何個でも。元配列の添字を持ち回る（編集の取り違え防止）
  const decsOf=is=>{const out=[];if(Array.isArray(is.decisions))is.decisions.forEach((d,i)=>{if(okObj(d))out.push({d,i});});return out;};
  const daysBetween=(a,b)=>Math.round((parse(b).getTime()-parse(a).getTime())/DAY_MS);
  function computeIssue(is,idx,TODAY,SR,SN){
    const closed=obj(is.closed), pd=pendOf(is,SN);
    const due=isDate(is.due)?is.due:null;
    const no=(is.id===null||is.id===undefined)?"":String(is.id);
  // actions は元配列の添字を持ち回る（編集の対象を取り違えないため）。非オブジェクト要素は捨てる
    const acts=[];
    if(Array.isArray(is.actions))is.actions.forEach((a,i)=>{if(a&&typeof a==="object"&&!Array.isArray(a))acts.push({a,i});});
    const nextE=acts.find(e=>e.a.done!==true);  // 次の一手＝未の最初の1件
    const anyDone=acts.some(e=>e.a.done===true);
    const state=STATES.find(s=>s.test({closed,anyDone})).k;
  // 方針＝決まったもの（decided あり）と未決（decided:null）に分ける。配列順＝表示順
    const decs=decsOf(is);
    const decDone=decs.filter(e=>isDate(e.d.decided));
    const decOpen=decs.filter(e=>!isDate(e.d.decided)).map(e=>{
      const until=isDate(e.d.until)?e.d.until:null;   // 「いつまでに決めるか」（任意）
      return Object.assign({days:isDate(e.d.since)?daysBetween(e.d.since,TODAY):null,
                            until, nudge:!!(until&&TODAY>until)},e);
    });
  // ★＝報告期間(SR)に動いたもの。済んだ行動・決めた方針・保留にした・閉じた（decisions[].since は含めない）
    const inSR=v=>isDate(v)&&v>=SR.from&&v<=SR.to;
    const starActs=new Set();
    acts.forEach(e=>{if(e.a.done===true&&inSR(e.a.date))starActs.add(e.i);});  // date:null の済み行動には付けない
    const starDecs=new Set();
    decDone.forEach(e=>{if(inSR(e.d.decided))starDecs.add(e.i);});
    const starPend=!!(pd&&inSR(pd.since)), starClosed=!!(closed&&inSR(closed.at));
    const star=starActs.size>0||starDecs.size>0||starPend||starClosed;
    const overdue=!!(due&&state!=="closed"&&TODAY>due);  // 期限超過＝本日>期限 かつ 未完了（完了行は赤にしない）
  // 印は完了には付けない。ただし ★ だけは例外（「今週閉じた」を報告に載せるため・作者裁定 2026-09-09）。
  // 件数・絞り込み・サマリ・タブは全部この marks を見る＝ずれない
  // 催促は3系統：待ちの期限切れ／未決の期限切れ／待っている相手の課題が完了済み。
  // 件数・絞り込みは marks.nudge（OR）だけを見る。どの理由かは行ごとに個別のフラグで出し分ける
    const nudgeWait=!!(pd&&pd.kind==="waiting"&&pd.until&&TODAY>pd.until);
    const nudgeDecs=new Set(decOpen.filter(e=>e.nudge).map(e=>e.i));
    const nudgeDone=!!(pd&&pd.kind==="waiting"&&pd.who.kind==="issue"&&issueClosed(pd.who.pj,pd.who.id));
    const nudge=nudgeWait||nudgeDecs.size>0||nudgeDone;
    const todoDays=(state==="todo"&&isDate(is.opened))?daysBetween(is.opened,TODAY):null;  // 未着手のまま経った日数
    const waitDays=(pd&&pd.kind==="waiting"&&pd.since)?daysBetween(pd.since,TODAY):null;
    const f={pk:pd?pd.kind:"",nOpen:decOpen.length,overdue,nudge,star};
    const marks=new Set(MARKS.filter(m=>(state!=="closed"||m.k==="star")&&m.test(f)).map(m=>m.k));
  // 担当は課題では持たず、行動ごとに書く。絞り込み用にその課題に出てくる担当の集合を作る（軸内OR）。
  // 行動0件／担当なしは "" ＝(未割当)扱い
    const asgSet=[...new Set(acts.map(e=>str(e.a.assignee)))];
    if(!asgSet.length)asgSet.push("");
    return {
      i:idx, no, pn:SN, key:SN+"|"+(no!==""?no:"i"+idx),  // key＝折りたたみのキー（案件ごと・id重複時は衝突するのが仕様）
      state, how:closed?str(closed.how):"", pd,
      prio:PRIORITIES.some(p=>p.k===is.priority)?is.priority:"mid",  // 3値以外は mid 扱い
      asgSet, due, overdue, marks, nOpen:decOpen.length,
      decs, decDone, decOpen,
      warn:(!str(is.ifIgnored)&&!str(is.ifDone))||!str(is.closeWhen),  // 「載せる」の二つの問い／完了条件が未回答＝薄い警告（エラーではない）
      acts, next:nextE?nextE.a:null,
      nudgeWait, nudgeDecs, nudgeDone, todoDays, waitDays,
      starActs, starDecs, starPend, starClosed, hasStar:marks.has("star"),
    };
  }


  // ===== 表示部品 =====
  const dateCell=(iso,ov)=>iso?`<span title="${esc(iso)}"${ov?` class="ovd"`:""}>${esc(mdSlash(iso))}</span>`:"—";
  const dateInput=(i,f,val,a,dec,ph)=>`<span class="is-date-wrap"><input data-i="${i}"${a===undefined?"":` data-a="${a}"`}${dec===undefined?"":` data-dec="${dec}"`} data-field="${f}" type="text" placeholder="${esc(ph||"MM-DD")}" value="${esc(val)}">`

  // 状態＝バッジ1つ（＋完了の閉じ方）。その下に小さく印。⚠は期限の列・★はタイトル横に出るのでここでは重ねない
  // 催促の理由（3系統）をツールチップにまとめる＝「何をすればいいか」が分かるように
  function nudgeTip(c){
    const r=[];
    if(c.nudgeDone)r.push(t("mkNudgeTipDone"));

  function stateCell(c){

    const mk=[];
